<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3efe7">
  <meta name="description" content="漫步在油画笔触般的四季森林与蜿蜒小径之间。">
  <title>林间漫游</title>
  <style>
    :root{color-scheme:light;--ink:#344033;--paper:#f3efe7;--glass:rgba(248,246,239,.78)}
    *{box-sizing:border-box}html,body{height:100%;width:100%;margin:0;overflow:hidden;background:var(--paper);color:var(--ink)}
    body{font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;user-select:none;-webkit-font-smoothing:antialiased}
    .scene{position:fixed;inset:0;overflow:hidden;touch-action:none;cursor:crosshair;background:#f3efe7}canvas{display:block;width:100%;height:100%}
    .paper{position:fixed;inset:0;pointer-events:none;opacity:.14;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 160 160' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.16'/%3E%3C/svg%3E")}
    header{position:fixed;z-index:2;inset:18px 24px auto;display:flex;justify-content:space-between;align-items:center;gap:12px;pointer-events:none}.brand{font-size:10px;letter-spacing:.25em;color:rgba(43,54,42,.62)}
    .seasons{pointer-events:auto;display:flex;gap:3px;padding:4px;border:1px solid rgba(71,81,62,.17);border-radius:24px;background:var(--glass);backdrop-filter:blur(8px)}.season{border:0;border-radius:20px;padding:8px 11px;background:transparent;color:#4c5946;font:12px inherit;cursor:pointer}.season[aria-pressed="true"]{background:#647b50;color:white}.season:focus-visible{outline:2px solid #718a58;outline-offset:2px}
    .footer{position:fixed;z-index:2;left:25px;right:25px;bottom:20px;display:flex;justify-content:space-between;align-items:end;color:rgba(43,54,42,.67);font-size:10px;letter-spacing:.14em;pointer-events:none;text-shadow:0 1px 5px rgba(255,255,255,.55)}.status:before{content:"";display:inline-block;width:25px;height:1px;margin:0 9px 3px 0;background:currentColor}.hint{text-align:right;line-height:1.8}
    @media(max-width:600px){header{inset:max(14px,env(safe-area-inset-top)) 14px auto}.brand{font-size:8px;letter-spacing:.12em}.season{padding:7px 8px;font-size:11px}.footer{left:16px;right:16px;bottom:max(15px,env(safe-area-inset-bottom));font-size:8px}}
  </style>
</head>
<body>
  <div class="scene" id="scene" aria-label="油画笔触风格的四季森林小路，可点击前行或拖动视角"><canvas id="forest" aria-label="JavaScript 绘制的油画感森林"></canvas></div>
  <div class="paper"></div>
  <header><div class="brand">A QUIET WALK · 林间漫游</div><div class="seasons" role="group" aria-label="选择季节"><button class="season" data-season="spring" aria-pressed="false">春</button><button class="season" data-season="summer" aria-pressed="true">夏</button><button class="season" data-season="autumn" aria-pressed="false">秋</button><button class="season" data-season="winter" aria-pressed="false">冬</button></div></header>
  <footer class="footer"><div class="status" id="status">夏日 · 林间小径</div><div class="hint">点击小路前行 · 拖动视角<br>方向键也可漫步</div></footer>
  <script>
  (()=>{
    'use strict';
    const canvas=document.getElementById('forest'),ctx=canvas.getContext('2d',{alpha:false}),scene=document.getElementById('scene'),status=document.getElementById('status'),TAU=Math.PI*2;
    const palettes={
      spring:{name:'春',sky:['#f7f3eb','#e9eddb','#dce6c8'],leaf:['#c9e76b','#a9d451','#79b449','#578d3d'],deep:['#6d9850','#557d45','#3f633b'],ground:'#c6b995',edge:'#95a16c',litter:['#d9b7a3','#bacb78','#d1d39a'],particle:'#f1d8ce'},
      summer:{name:'夏',sky:['#f6f2e9','#e6ebd7','#d1dfc1'],leaf:['#b8d94d','#91c64b','#72ae43','#4f8739'],deep:['#668b48','#4d743e','#395e35'],ground:'#bca982',edge:'#89945e',litter:['#c9bd8d','#97895f','#71804b'],particle:'#f4e796'},
      autumn:{name:'秋',sky:['#f6eee2','#efe0c7','#ddc9a7'],leaf:['#e2b64d','#d58d3f','#bd6937','#8d4e32'],deep:['#a5763e','#845c37','#604732'],ground:'#b5966a',edge:'#8d714c',litter:['#d48b48','#c16a3e','#987343'],particle:'#d78b4b'},
      winter:{name:'冬',sky:['#f1f3f0','#e1e9e9','#d0dcdf'],leaf:['#aab9ad','#849a8d','#6d857b','#536c64'],deep:['#70887e','#566f68','#415b55'],ground:'#c4c7bd',edge:'#a0aaa2',litter:['#e5e8e2','#bac7c3','#8d9b95'],particle:'#fff'}
    };
    let season='summer',w=0,h=0,dpr=1,seed=9713,trees=[],groundBits=[],particles=[],cameraZ=0,yaw=0,targetYaw=0,drag=null,lastRender=0;
    function random(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}
    function hash(n){const x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x)}
    function makeScene(){seed=9713;trees=[];groundBits=[];const count=Math.min(155,Math.max(92,Math.round(w*h/4800)));for(let i=0;i<count;i++){const side=random()<.5?-1:1;trees.push({side,offset:3.1+random()*21,depth:4+random()*175,height:7+random()*13,radius:1.1+random()*2.5,kind:random(),tone:random(),seed:random()*10000,lean:(random()-.5)*.24,bark:random(),crown:random(),branch:random()})}for(let i=0;i<240;i++)groundBits.push({depth:2+random()*135,x:(random()-.5)*12,size:.2+random()*1.5,angle:random()*TAU,tone:random(),leaf:random()<.63})}
    function setSize(){const box=canvas.getBoundingClientRect();w=box.width;h=box.height;dpr=Math.min(window.devicePixelRatio||1,1.35);canvas.width=Math.max(1,Math.round(w*dpr));canvas.height=Math.max(1,Math.round(h*dpr));ctx.setTransform(dpr,0,0,dpr,0,0);makeScene();resetParticles()}
    function resetParticles(){const count=season==='winter'?22:season==='autumn'?15:season==='spring'?10:4;particles=Array.from({length:count},()=>({x:random()*w,y:random()*h,v:.2+random()*.5,drift:(random()-.5)*.35,size:.7+random()*1.5,rot:random()*TAU,alpha:.22+random()*.36}))}
    function selectSeason(value){if(!palettes[value])return;season=value;document.querySelectorAll('.season').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.season===value)));status.textContent=palettes[season].name+' · 林间小径';resetParticles()}
    document.querySelectorAll('.season').forEach(b=>b.addEventListener('click',()=>selectSeason(b.dataset.season)));
    function centerline(z){return Math.sin(z*.019)*7.5+Math.sin(z*.047+1.1)*1.6+Math.sin(z*.008)*3.1}
    function project(x,depth,y=0){const focal=h*.76,forward=depth*Math.cos(yaw)+x*Math.sin(yaw);if(forward<1)return null;const lateral=x*Math.cos(yaw)-depth*Math.sin(yaw),scale=focal/forward;return{x:w*.5+lateral*scale,y:h*.49+(1.35-y)*scale,scale,depth:forward}}
    function shape(points,color){ctx.fillStyle=color;ctx.beginPath();for(let i=0;i<points.length;i++){const p=points[i];if(i===0)ctx.moveTo(p.x,p.y);else ctx.lineTo(p.x,p.y)}ctx.closePath();ctx.fill()}
    function drawSky(){const p=palettes[season],g=ctx.createLinearGradient(0,0,0,h*.8);g.addColorStop(0,p.sky[0]);g.addColorStop(.52,p.sky[1]);g.addColorStop(1,p.sky[2]);ctx.fillStyle=g;ctx.fillRect(0,0,w,h);const light=ctx.createRadialGradient(w*.52,h*.36,2,w*.52,h*.36,h*.5);light.addColorStop(0,'rgba(255,255,236,.58)');light.addColorStop(.42,'rgba(248,239,199,.18)');light.addColorStop(1,'rgba(248,239,199,0)');ctx.fillStyle=light;ctx.fillRect(0,0,w,h*.88);
      for(let layer=0;layer<4;layer++){const y=h*(.34+layer*.045);ctx.beginPath();ctx.moveTo(0,h);for(let x=0;x<=w+12;x+=14){ctx.lineTo(x,y+Math.sin(x*.009+layer*2.8)*h*.022+Math.sin(x*.027+layer)*h*.008)}ctx.lineTo(w,h);ctx.closePath();ctx.fillStyle=['rgba(140,165,117,.12)','rgba(108,142,88,.19)','rgba(83,119,70,.25)','rgba(61,94,58,.28)'][layer];ctx.fill()}}
    function drawPath(){const p=palettes[season],left=[],right=[],outerL=[],outerR=[];for(let i=0;i<=70;i++){const d=2+i*2,c=centerline(cameraZ+d)-centerline(cameraZ),half=.95+d*.031,a=project(c-half,d),b=project(c+half,d),oa=project(c-half*1.25,d),ob=project(c+half*1.25,d);if(a&&b&&oa&&ob){left.push(a);right.push(b);outerL.push(oa);outerR.push(ob)}}if(left.length<2)return;shape([...outerL,...outerR.slice().reverse()],p.edge);shape([...left,...right.slice().reverse()],p.ground);
      for(let side of [-1,1]){ctx.beginPath();let started=false;for(let i=0;i<=52;i++){const d=3+i*2.65,c=centerline(cameraZ+d)-centerline(cameraZ),q=project(c+side*(.67+d*.021),d,.02);if(!q)continue;if(!started){ctx.moveTo(q.x,q.y);started=true}else ctx.lineTo(q.x,q.y)}ctx.strokeStyle='rgba(94,83,60,.2)';ctx.lineWidth=1.1;ctx.stroke()}
      for(const bit of groundBits){let d=((bit.depth-cameraZ)%135+135)%135;if(d<2)d+=135;const c=centerline(cameraZ+d)-centerline(cameraZ),q=project(c+bit.x*(.32+d*.012),d,.025);if(!q||q.y<h*.51)continue;const size=Math.min(10,Math.max(.45,bit.size*q.scale*.12));ctx.save();ctx.translate(q.x,q.y);ctx.rotate(bit.angle);ctx.fillStyle=bit.leaf?p.litter[Math.floor(bit.tone*p.litter.length)]:'rgba(101,94,73,.34)';ctx.beginPath();ctx.ellipse(0,0,size*(bit.leaf?1.6:1),size*.52,0,0,TAU);ctx.fill();if(bit.leaf){ctx.strokeStyle='rgba(86,75,54,.25)';ctx.lineWidth=Math.max(.35,size*.12);ctx.beginPath();ctx.moveTo(-size,0);ctx.lineTo(size,0);ctx.stroke()}ctx.restore()}}
    function drawBark(x,top,base,tw,height,tree){const grad=ctx.createLinearGradient(x-tw,0,x+tw,0);grad.addColorStop(0,'#5d402e');grad.addColorStop(.24,tree.bark>.5?'#b08353':'#96704b');grad.addColorStop(.52,'#704a32');grad.addColorStop(.8,'#a47a4e');grad.addColorStop(1,'#59402f');ctx.fillStyle=grad;ctx.beginPath();ctx.moveTo(x-tw*1.5,base+1);ctx.bezierCurveTo(x-tw*.8,base-height*.18,x-tw*.55,top+height*.3,x-tw*.3,top);ctx.quadraticCurveTo(x,top-height*.04,x+tw*.28,top);ctx.bezierCurveTo(x+tw*.55,top+height*.34,x+tw*.7,base-height*.16,x+tw*1.35,base+1);ctx.closePath();ctx.fill();if(height>12){for(let k=-2;k<=2;k++){const dx=k*tw*.34;ctx.strokeStyle=k%2?'rgba(225,181,125,.26)':'rgba(55,38,28,.32)';ctx.lineWidth=Math.max(.35,tw*.12);ctx.beginPath();ctx.moveTo(x+dx,base-height*.04);ctx.bezierCurveTo(x+dx-tw*.15,base-height*.32,x+dx+tw*.14,top+height*.32,x+dx*.7,top+height*.09);ctx.stroke()}ctx.strokeStyle='rgba(73,48,31,.56)';ctx.lineWidth=Math.max(.5,tw*.27);for(const s of [-1,1]){ctx.beginPath();ctx.moveTo(x+s*tw*.2,base);ctx.quadraticCurveTo(x+s*tw*1.3,base-tw,x+s*tw*2.15,base+1);ctx.stroke()}}}
    // One irregular silhouette per crown, then directional, varied paint strokes—not repeated circles.
    function paintCrown(cx,cy,rx,ry,tree,palette,depth){const seed=tree.seed;const lobes=9+Math.floor(hash(seed+7)*5),phase=hash(seed+11)*TAU;ctx.beginPath();for(let i=0;i<=lobes*4;i++){const a=phase+i/lobes/4*TAU;const irregular=.78+.17*Math.sin(a*3+seed)+.12*Math.sin(a*7+seed*.31)+.06*Math.cos(a*11+seed);const x=cx+Math.cos(a)*rx*irregular,y=cy+Math.sin(a)*ry*(.82+.18*Math.sin(a*4+seed*.2));if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)}ctx.closePath();const base=palette[Math.floor(hash(seed+3)*palette.length)];ctx.fillStyle=base;ctx.fill();
      // Broad, tapered daubs curve with the crown; varied direction/length avoids a tiled motif.
      const strokes=Math.min(58,Math.max(10,Math.round(rx*1.35)));for(let i=0;i<strokes;i++){const u=hash(seed+i*13.7)*2-1,v=hash(seed+i*19.3)*2-1;if(u*u+v*v>.9)continue;const px=cx+u*rx*.84,py=cy+v*ry*.78,len=(.08+hash(seed+i*31.1)*.18)*rx,angle=-.55+u*.48+Math.sin(v*3+seed)*.22,thick=Math.max(.55,ry*(.035+hash(seed+i*41.7)*.035));const color=palette[Math.floor(hash(seed+i*7.9+5)*palette.length)];ctx.strokeStyle=color;ctx.globalAlpha=.48+hash(seed+i*23)*.38;ctx.lineWidth=thick;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(px-len*.5*Math.cos(angle),py-len*.5*Math.sin(angle));ctx.quadraticCurveTo(px+Math.sin(i)*thick,py-thick*.8,px+len*.5*Math.cos(angle),py+len*.5*Math.sin(angle));ctx.stroke()}
      // Broken, restrained highlights catch the upper-left light like loaded oil paint.
      ctx.globalAlpha=1;for(let i=0;i<Math.max(4,Math.round(strokes*.2));i++){const u=hash(seed+i*51+99)*1.45-.95,v=hash(seed+i*17+201)*1.25-.82;if(u*u+v*v>1)continue;const px=cx+u*rx*.8,py=cy+v*ry*.7,len=rx*(.035+hash(seed+i*71)*.075);ctx.strokeStyle=season==='autumn'?'rgba(255,213,135,.62)':season==='winter'?'rgba(235,241,233,.55)':'rgba(239,247,153,.62)';ctx.lineWidth=Math.max(.55,ry*.032);ctx.lineCap='round';ctx.beginPath();ctx.moveTo(px-len*.5,py);ctx.quadraticCurveTo(px,py-ry*.03,px+len*.5,py-ry*.025);ctx.stroke()}ctx.globalAlpha=1;
      if(depth>70){ctx.fillStyle=`rgba(238,237,214,${Math.min(.38,(depth-70)/230)})`;ctx.fill()}}
    function drawTree(tree,depth){const center=centerline(cameraZ+depth)-centerline(cameraZ),point=project(center+tree.side*tree.offset,depth);if(!point||point.x<-w*.22||point.x>w*1.22)return;const s=point.scale,height=tree.height*s;if(height<1.6)return;const base=point.y,top=base-height,tw=Math.max(.65,tree.radius*s*.24),lean=tree.lean*height,canopyW=Math.max(2,tree.radius*s*(tree.kind<.2?1.7:2.05)),p=palettes[season];
      // Every tree has its own leaning trunk and fork pattern; foreground trees have visible limb structure.
      drawBark(point.x,top+height*.16,base,tw,height,tree);ctx.strokeStyle='#765039';ctx.lineCap='round';const forks=tree.kind<.2?3:4;for(let b=0;b<forks;b++){const side=b%2?1:-1,startY=base-height*(.48+b*.075),startX=point.x+lean*(1-startY/base);const reach=canopyW*(.52+hash(tree.seed+b)*.34),endX=point.x+lean+side*reach,endY=top+height*(.18+hash(tree.seed+b+8)*.16);ctx.lineWidth=Math.max(.55,tw*(.48-b*.06));ctx.beginPath();ctx.moveTo(startX,startY);ctx.bezierCurveTo(startX+side*reach*.18,startY-height*.08,endX-side*reach*.28,endY+height*.07,endX,endY);ctx.stroke();if(height>24){ctx.lineWidth=Math.max(.4,tw*.22);ctx.beginPath();ctx.moveTo(endX-side*reach*.32,endY+height*.06);ctx.quadraticCurveTo(endX-side*reach*.14,endY-height*.015,endX-side*reach*.08,endY-height*.1);ctx.stroke()}}
      if(tree.kind<.2){const layers=4+Math.floor(hash(tree.seed+44)*3);for(let j=0;j<layers;j++){const f=.16+j*.115,cy=top+height*f,rx=canopyW*(.34+j*.17),ry=height*(.17-j*.012);ctx.beginPath();ctx.moveTo(point.x+lean*f,cy-ry);ctx.bezierCurveTo(point.x+lean*f-rx*.2,cy-ry*.65,point.x+lean*f-rx*.76,cy-ry*.12,point.x+lean*f-rx,cy+ry*.35);ctx.quadraticCurveTo(point.x+lean*f-rx*.34,cy+ry*.12,point.x+lean*f,cy+ry*.58);ctx.quadraticCurveTo(point.x+lean*f+rx*.36,cy+ry*.12,point.x+lean*f+rx,cy+ry*.32);ctx.bezierCurveTo(point.x+lean*f+rx*.7,cy-ry*.3,point.x+lean*f+rx*.25,cy-ry*.86,point.x+lean*f,cy-ry);ctx.closePath();ctx.fillStyle=p.deep[Math.min(2,Math.floor(j/2))];ctx.fill();ctx.strokeStyle='rgba(211,222,158,.3)';ctx.lineWidth=Math.max(.45,s*.025);ctx.beginPath();ctx.moveTo(point.x+lean*f,cy-ry*.3);ctx.lineTo(point.x+lean*f-rx*.7,cy+ry*.28);ctx.moveTo(point.x+lean*f,cy-ry*.3);ctx.lineTo(point.x+lean*f+rx*.72,cy+ry*.25);ctx.stroke();if(season==='winter'&&j%2===0){ctx.strokeStyle='rgba(250,251,245,.75)';ctx.lineWidth=Math.max(.7,s*.035);ctx.beginPath();ctx.moveTo(point.x+lean*f-rx*.7,cy+ry*.28);ctx.quadraticCurveTo(point.x+lean*f,cy+ry*.5,point.x+lean*f+rx*.72,cy+ry*.25);ctx.stroke()}}}
      else{const crownCount=tree.kind>.82?3:tree.kind>.55?2:1;for(let c=0;c<crownCount;c++){const cx=point.x+lean+(c-(crownCount-1)/2)*canopyW*.42,cy=top+height*(.22+hash(tree.seed+c*8)*.11),rx=canopyW*(crownCount===1?1:.64)*(1+hash(tree.seed+c*3)*.25),ry=height*(.25+hash(tree.seed+c*21)*.07),localSeed=tree.seed+c*109.31;paintCrown(cx,cy,rx,ry,{seed:localSeed},p.leaf,depth)}}
      if(season==='winter'&&tree.kind>.2){ctx.strokeStyle='rgba(103,125,116,.58)';ctx.lineWidth=Math.max(.45,s*.018);for(let b=0;b<5;b++){const bx=point.x+lean+(b-2)*canopyW*.31;ctx.beginPath();ctx.moveTo(point.x+lean,top+height*.5);ctx.quadraticCurveTo(bx,top+height*.29,bx+(b-2)*canopyW*.1,top+height*.12);ctx.stroke()}}
      const haze=Math.max(0,Math.min(.28,(depth-78)/240));if(haze){ctx.fillStyle=`rgba(238,237,214,${haze})`;ctx.beginPath();ctx.ellipse(point.x,top+height*.35,canopyW,height*.1,0,0,TAU);ctx.fill()}}
    function drawUnderstory(){const p=palettes[season];for(let i=0;i<groundBits.length;i+=3){const bit=groundBits[i];let d=((bit.depth-cameraZ)%95+95)%95;if(d<2)d+=95;const side=bit.x<0?-1:1,c=centerline(cameraZ+d)-centerline(cameraZ),q=project(c+side*(2.1+Math.abs(bit.x)*.42),d);if(!q||q.y<h*.51)continue;const r=Math.max(.6,bit.size*q.scale*.16);ctx.fillStyle=p.deep[Math.floor(bit.tone*p.deep.length)];ctx.beginPath();ctx.ellipse(q.x,q.y,r*1.6,r*.47,bit.angle,0,TAU);ctx.fill();if(r>2){ctx.strokeStyle='rgba(222,224,166,.4)';ctx.lineWidth=.6;ctx.beginPath();ctx.moveTo(q.x,q.y);ctx.lineTo(q.x-r*1.3,q.y-r*.65);ctx.moveTo(q.x,q.y);ctx.lineTo(q.x+r*1.2,q.y-r*.48);ctx.stroke()}}}
    function drawAir(dt){const p=palettes[season];ctx.save();for(const item of particles){item.y+=item.v*dt*.026;item.x+=item.drift*dt*.025;if(item.y>h+8){item.y=-8;item.x=random()*w}if(item.x<-6)item.x=w+6;if(item.x>w+6)item.x=-6;ctx.globalAlpha=item.alpha;ctx.fillStyle=p.particle;if(season==='winter'){ctx.beginPath();ctx.arc(item.x,item.y,item.size*.65,0,TAU);ctx.fill()}else if(season==='autumn'||season==='spring'){ctx.save();ctx.translate(item.x,item.y);ctx.rotate(item.rot+item.y*.004);ctx.beginPath();ctx.ellipse(0,0,item.size*1.5,item.size*.52,0,0,TAU);ctx.fill();ctx.restore()}else{ctx.beginPath();ctx.arc(item.x,item.y,item.size*.4,0,TAU);ctx.fill()}}ctx.restore();const fog=ctx.createLinearGradient(0,h*.43,0,h*.84);fog.addColorStop(0,'rgba(239,239,218,0)');fog.addColorStop(.6,season==='winter'?'rgba(238,243,243,.19)':'rgba(228,235,207,.1)');fog.addColorStop(1,'rgba(239,239,218,0)');ctx.fillStyle=fog;ctx.fillRect(0,h*.4,w,h*.45)}
    function render(now){requestAnimationFrame(render);if(now-lastRender<55)return;const dt=Math.min(100,now-lastRender||55);lastRender=now;yaw+=(targetYaw-yaw)*.075;drawSky();drawPath();const ordered=trees.map(tree=>({tree,depth:((tree.depth-cameraZ)%180+180)%180||180})).sort((a,b)=>b.depth-a.depth);for(const item of ordered)drawTree(item.tree,item.depth);drawUnderstory();drawAir(dt)}
    function walk(){cameraZ+=8;const names=['林间小径','深林深处','林间转弯','苔石小路','林间幽径','无尽林海'];status.textContent=palettes[season].name+' · '+names[Math.floor(cameraZ/8)%names.length]}
    scene.addEventListener('pointerdown',event=>{drag={x:event.clientX,y:event.clientY,lastX:event.clientX,moved:false};scene.setPointerCapture?.(event.pointerId)});
    scene.addEventListener('pointermove',event=>{if(!drag)return;if(Math.abs(event.clientX-drag.x)>5||Math.abs(event.clientY-drag.y)>5)drag.moved=true;if(drag.moved)targetYaw=Math.max(-.55,Math.min(.55,targetYaw-(event.clientX-drag.lastX)/Math.max(1,w)*.8));drag.lastX=event.clientX;drag.lastY=event.clientY});
    scene.addEventListener('pointerup',event=>{if(drag&&!drag.moved){walk();targetYaw=Math.max(-.55,Math.min(.55,targetYaw+(event.clientX/w-.5)*.08))}drag=null});scene.addEventListener('pointercancel',()=>drag=null);
    window.addEventListener('keydown',event=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' ','w','a','s','d'].includes(event.key)){event.preventDefault();if(event.key==='ArrowLeft'||event.key==='a')targetYaw=Math.max(-.55,targetYaw-.08);else if(event.key==='ArrowRight'||event.key==='d')targetYaw=Math.min(.55,targetYaw+.08);else walk()}});
    window.addEventListener('resize',setSize);setSize();requestAnimationFrame(render);
  })();
  </script>
</body>
</html>
