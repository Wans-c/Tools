<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101710">
  <meta name="description" content="JavaScript 程序化绘制的四季森林与蜿蜒小径。">
  <title>林间 · 无尽漫游</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Noto+Serif+SC:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root{color-scheme:dark;--cream:#f2efe5;--sans:'DM Sans',sans-serif}
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#101914;color:var(--cream)}
    body{font-family:var(--sans);-webkit-font-smoothing:antialiased;user-select:none}
    .scene{position:fixed;inset:0;overflow:hidden;cursor:crosshair;touch-action:none;background:#17231b}canvas{display:block;width:100%;height:100%}
    .shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(8,14,10,.35),transparent 25%,transparent 62%,rgba(7,12,8,.42)),radial-gradient(ellipse at 50% 45%,transparent 42%,rgba(4,8,6,.22) 88%,rgba(4,8,6,.48) 140%)}
    header{position:fixed;z-index:2;top:0;left:0;right:0;padding:clamp(20px,3vw,40px) clamp(20px,4vw,60px);display:flex;align-items:center;justify-content:space-between;gap:14px;pointer-events:none}
    .brand{font-size:11px;letter-spacing:.23em;text-transform:uppercase;color:rgba(242,239,229,.9);text-shadow:0 2px 12px #111;white-space:nowrap}.controls{pointer-events:auto;display:flex;align-items:center;gap:8px}
    .season-switch{display:flex;align-items:center;gap:3px;padding:4px;border:1px solid rgba(255,255,255,.25);border-radius:100px;background:rgba(16,23,17,.4);backdrop-filter:blur(12px)}
    .season{border:0;background:transparent;color:rgba(255,255,255,.8);border-radius:100px;padding:8px 11px;font:500 11px var(--sans);letter-spacing:.08em;cursor:pointer;transition:background .2s,color .2s}.season:hover,.season:focus-visible{color:#fff;background:rgba(255,255,255,.12);outline:none}.season[aria-pressed="true"]{background:rgba(242,239,229,.92);color:#1a211a}
    .sound{color:inherit;display:flex;align-items:center;gap:10px;border:1px solid rgba(255,255,255,.3);background:rgba(16,23,17,.4);backdrop-filter:blur(12px);border-radius:100px;padding:10px 15px;font:500 11px var(--sans);letter-spacing:.1em;cursor:pointer}.sound:hover,.sound:focus-visible{background:rgba(255,255,255,.14);outline:none}
    .sound-icon{width:14px;height:14px;display:flex;align-items:center;justify-content:center;gap:2px}.sound-icon i{display:block;width:2px;height:5px;border-radius:2px;background:currentColor;transition:height .2s}.sound[aria-pressed="true"] .sound-icon i:nth-child(1){height:8px}.sound[aria-pressed="true"] .sound-icon i:nth-child(2){height:13px}.sound[aria-pressed="true"] .sound-icon i:nth-child(3){height:6px}.sound[aria-pressed="true"] .sound-icon i:nth-child(4){height:10px}
    .bottom{position:fixed;z-index:2;left:0;right:0;bottom:0;padding:26px clamp(24px,5vw,72px) max(26px,env(safe-area-inset-bottom));display:flex;align-items:flex-end;justify-content:space-between;color:rgba(242,239,229,.82);font-size:10px;letter-spacing:.16em;text-transform:uppercase;pointer-events:none;text-shadow:0 1px 9px #111}.location{display:flex;align-items:center;gap:10px}.location:before{content:"";height:1px;width:28px;background:rgba(242,239,229,.7)}
    .hint{display:flex;align-items:center;gap:9px;text-align:right}.mouse{width:15px;height:22px;border:1px solid rgba(242,239,229,.72);border-radius:9px;position:relative}.mouse:after{content:"";position:absolute;width:2px;height:4px;left:5px;top:4px;border-radius:2px;background:currentColor;animation:scroll 1.6s ease infinite}@keyframes scroll{to{transform:translateY(6px);opacity:0}}
    .walk-label{position:fixed;z-index:2;top:50%;left:50%;transform:translate(-50%,-50%);font:400 12px 'Noto Serif SC',serif;letter-spacing:.28em;color:#fff;opacity:0;transition:opacity .35s;pointer-events:none;text-shadow:0 2px 12px #000}.show-label .walk-label{opacity:1}
    @media(max-width:600px){header{padding-top:max(18px,env(safe-area-inset-top));align-items:flex-start}.brand{font-size:8px;letter-spacing:.13em;padding-top:10px}.controls{gap:5px}.season{padding:7px 8px;font-size:10px}.sound{padding:9px 10px;font-size:0}.sound-icon{width:16px}.bottom{font-size:8px;padding-bottom:max(22px,env(safe-area-inset-bottom))}.hint{max-width:145px;line-height:1.8}}
    @media(prefers-reduced-motion:reduce){.mouse:after{animation:none}}
  </style>
</head>
<body>
  <div class="scene" id="scene" aria-label="实时程序化绘制的可交互森林"><canvas id="forest" aria-label="四季森林与蜿蜒小径"></canvas><div class="shade"></div></div>
  <header><div class="brand">A QUIET WALK · 林间漫游</div><div class="controls"><div class="season-switch" role="group" aria-label="切换森林季节"><button class="season" data-season="spring" aria-pressed="false">春</button><button class="season" data-season="summer" aria-pressed="true">夏</button><button class="season" data-season="autumn" aria-pressed="false">秋</button><button class="season" data-season="winter" aria-pressed="false">冬</button></div><button class="sound" id="sound" type="button" aria-pressed="false" aria-label="开启森林环境音"><span class="sound-icon" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span id="soundText">声音</span></button></div></header>
  <div class="walk-label">沿着小路，继续向前</div>
  <footer class="bottom"><div class="location" id="location">夏日 · 林间小径</div><div class="hint"><span class="mouse" aria-hidden="true"></span><span>点击前行 · 拖动视角<br>或使用方向键漫步</span></div></footer>
  <script>
  (()=>{
    const canvas=document.getElementById('forest'),ctx=canvas.getContext('2d',{alpha:false}),scene=document.getElementById('scene');
    const sound=document.getElementById('sound'),soundText=document.getElementById('soundText'),locationLabel=document.getElementById('location');
    const TAU=Math.PI*2;
    const seasons={spring:{label:'春',sky:['#314441','#71887a','#c7c2a2','#5a684d'],leaves:['#9cac68','#789455','#5c7948','#3d5a39'],ground:'#665d46',edge:'#38443a',debris:['#817650','#a58b5d','#596047'],particle:'#f1d8ce',count:14,snow:false},summer:{label:'夏',sky:['#182923','#536c58','#b3ad8b','#3d503c'],leaves:['#687b4d','#536c43','#3c5738','#263b2b'],ground:'#655c45',edge:'#343e31',debris:['#5c5036','#80734e','#414432'],particle:'rgba(231,221,159,.8)',count:9,snow:false},autumn:{label:'秋',sky:['#342a22','#76614a','#c69b68','#554333'],leaves:['#d09a4e','#bd7137','#985333','#65402e'],ground:'#70583c',edge:'#4c3d2c',debris:['#bd7339','#c18d4e','#806039'],particle:'#d89755',count:24,snow:false},winter:{label:'冬',sky:['#1c2a32','#596a70','#c2c8c4','#56615e'],leaves:['#819087','#63746b','#465b52','#30433e'],ground:'#898a80',edge:'#59625c',debris:['#d8d8cf','#c6c9c4','#727d75'],particle:'#f2f5f2',count:32,snow:true}};
    let season='summer',w=0,h=0,dpr=1,seed=90210,trees=[],groundDetails=[],particles=[],camera={z:0,yaw:0,targetYaw:0},drag=null,audio=null,lastFrame=0;
    const rand=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296};
    function makeWorld(){seed=90210;trees=[];groundDetails=[];const n=Math.min(155,Math.max(85,Math.round(w*h/4800)));for(let i=0;i<n;i++){const side=rand()<.5?-1:1;trees.push({side,offset:3.3+rand()*22,z:4+rand()*190,height:8+rand()*17,r:.65+rand()*1.8,tone:rand(),lean:(rand()-.5)*.24,seed:rand(),kind:rand(),bark:rand()})}for(let i=0;i<380;i++)groundDetails.push({z:2+rand()*150,x:(rand()-.5)*13,size:.15+rand()*.9,angle:rand()*TAU,tone:rand(),kind:rand()});resetParticles()}
    function resize(){const r=canvas.getBoundingClientRect();w=r.width;h=r.height;dpr=Math.min(devicePixelRatio||1,1.15);canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);makeWorld()}
    function resetParticles(){const n=seasons[season].count;particles=Array.from({length:n},()=>({x:rand()*Math.max(1,w),y:rand()*Math.max(1,h),speed:.18+rand()*.65,drift:(rand()-.5)*.38,size:.7+rand()*1.8,phase:rand()*TAU,alpha:.25+rand()*.45}))}
    function selectSeason(value){if(!seasons[value])return;season=value;document.querySelectorAll('.season').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.season===value)));locationLabel.textContent=seasons[value].label+' · 林间小径';resetParticles()}
    document.querySelectorAll('.season').forEach(b=>b.addEventListener('click',()=>selectSeason(b.dataset.season)));
    // Smooth, multi-frequency centerline creates successive broad S-bends in perspective.
    const path=(z)=>Math.sin(z*.019)*9.4+Math.sin(z*.043+1.15)*2.1+Math.sin(z*.0072)*3.1;
    function project(x,depth,y=0){if(depth<.75)return null;const focal=h*.9,rx=x,side=rx*Math.cos(camera.yaw)-depth*Math.sin(camera.yaw),forward=depth*Math.cos(camera.yaw)+rx*Math.sin(camera.yaw);if(forward<.75)return null;const scale=focal/forward;return{x:w*.5+side*scale,y:h*.49+(1.42-y)*scale,scale,depth:forward}}
    function fillShape(points,color){ctx.fillStyle=color;ctx.beginPath();for(let i=0;i<points.length;i++){const p=points[i];if(!p)continue;i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y)}ctx.closePath();ctx.fill()}
    function drawSky(){const s=seasons[season],g=ctx.createLinearGradient(0,0,0,h*.79);g.addColorStop(0,s.sky[0]);g.addColorStop(.38,s.sky[1]);g.addColorStop(.74,s.sky[2]);g.addColorStop(1,s.sky[3]);ctx.fillStyle=g;ctx.fillRect(0,0,w,h);const glow=ctx.createRadialGradient(w*.52,h*.39,1,w*.52,h*.42,h*.46);glow.addColorStop(0,'rgba(250,229,181,.24)');glow.addColorStop(.34,'rgba(225,219,178,.1)');glow.addColorStop(1,'rgba(225,219,178,0)');ctx.fillStyle=glow;ctx.fillRect(0,0,w,h*.9);
      // Distant tree ridges are layered with broken canopy silhouettes.
      for(let layer=0;layer<5;layer++){const y=h*(.30+layer*.042);ctx.beginPath();ctx.moveTo(0,h);for(let x=0;x<=w+14;x+=10){const contour=y+Math.sin(x*.008+layer*2.7)*h*.022+Math.sin(x*.026+layer)*h*.009+Math.sin(x*.061+layer*4)*h*.004;ctx.lineTo(x,contour)}ctx.lineTo(w,h);ctx.closePath();ctx.fillStyle=['rgba(70,87,68,.22)','rgba(47,68,51,.34)','rgba(34,54,39,.48)','rgba(25,43,32,.65)','rgba(17,32,24,.82)'][layer];ctx.fill()}}
    function drawTrail(){const s=seasons[season],left=[],right=[],shoulderL=[],shoulderR=[];for(let i=0;i<=100;i++){const d=1.2+i*1.6,c=path(camera.z+d)-path(camera.z),half=.95+d*.031;const a=project(c-half,d),b=project(c+half,d),oa=project(c-half*1.22,d),ob=project(c+half*1.22,d);if(a&&b&&oa&&ob){left.push(a);right.push(b);shoulderL.push(oa);shoulderR.push(ob)}}if(left.length<2)return;fillShape([...shoulderL,...shoulderR.slice().reverse()],s.edge);fillShape([...left,...right.slice().reverse()],s.ground);
      // Dappled light pools and wheel/foot-worn ruts follow every bend of the trail.
      for(let i=0;i<9;i++){const d=9+i*13,center=path(camera.z+d)-path(camera.z),p=project(center,d,.01);if(!p)continue;const rx=Math.max(2,p.scale*(1.2+d*.024)),ry=Math.max(1,p.scale*.22;ctx.fillStyle=`rgba(202,190,143,${.025+(i%3)*.012})`;ctx.beginPath();ctx.ellipse(p.x,p.y,rx,ry,0,0,TAU);ctx.fill()}
      for(let side of [-1,1]){ctx.beginPath();for(let i=0;i<=80;i++){const d=2+i*1.95,c=path(camera.z+d)-path(camera.z),p=project(c+side*(.66+d*.022),d,.018);if(!p)continue;i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y)}ctx.strokeStyle='rgba(28,30,23,.32)';ctx.lineWidth=1.3;ctx.stroke()}
      for(const item of groundDetails){let d=((item.z-camera.z)%150+150)%150;if(d<2)d+=150;const c=path(camera.z+d)-path(camera.z),p=project(c+item.x*(.25+d*.016),d,.02);if(!p||p.y<h*.48)continue;const size=Math.min(12,Math.max(.35,item.size*p.scale*.12));ctx.save();ctx.translate(p.x,p.y);ctx.rotate(item.angle);if(item.kind<.48){ctx.fillStyle=s.debris[Math.floor(item.tone*s.debris.length)];ctx.beginPath();ctx.ellipse(0,0,size*1.7,size*.52,0,0,TAU);ctx.fill();ctx.strokeStyle='rgba(31,30,22,.35)';ctx.lineWidth=Math.max(.35,size*.12);ctx.beginPath();ctx.moveTo(-size,0);ctx.lineTo(size,0);ctx.stroke()}else{ctx.fillStyle=season==='winter'?'rgba(234,237,230,.65)':'rgba(40,42,32,.5)';ctx.beginPath();ctx.ellipse(0,0,size,size*.6,0,0,TAU);ctx.fill()}ctx.restore()}
      if(s.snow){const snow=ctx.createLinearGradient(0,h*.58,0,h);snow.addColorStop(0,'rgba(230,235,229,0)');snow.addColorStop(1,'rgba(221,226,218,.35)');ctx.fillStyle=snow;ctx.fillRect(0,h*.58,w,h*.42)}}
    function drawTree(tree,depth){const center=path(camera.z+depth)-path(camera.z),p=project(center+tree.side*tree.offset,depth);if(!p||p.x<-w*.2||p.x>w*1.2)return;const s=p.scale,height=tree.height*s;if(height<1)return;const base=p.y,top=base-height,thick=Math.max(.7,tree.r*s*.22),lean=tree.lean*height,palette=seasons[season].leaves,crownW=Math.max(2,tree.r*s*2.3);
      // Tapered trunk, exposed root flares, bark plates and long grain grooves.
      const bark=ctx.createLinearGradient(p.x-thick*1.7,0,p.x+thick*1.7,0);bark.addColorStop(0,'#111812');bark.addColorStop(.2,tree.bark>.5?'#514832':'#393c2c');bark.addColorStop(.46,tree.bark>.55?'#766647':'#5b533a');bark.addColorStop(.7,'#38392a');bark.addColorStop(1,'#111710');ctx.fillStyle=bark;ctx.beginPath();ctx.moveTo(p.x-thick*1.35,base+2);ctx.quadraticCurveTo(p.x-thick*.75,base-thick*1.3,p.x+lean-thick*.27,top+height*.14);ctx.lineTo(p.x+lean+thick*.3,top+height*.14);ctx.quadraticCurveTo(p.x+thick*.8,base-thick, p.x+thick*1.45,base+2);ctx.closePath();ctx.fill();
      if(s>2.8){ctx.strokeStyle='rgba(22,25,18,.72)';ctx.lineWidth=Math.max(.45,thick*.25);for(let k=-1;k<=1;k++){ctx.beginPath();ctx.moveTo(p.x+k*thick*.28,base-height*.08);ctx.bezierCurveTo(p.x+k*thick*.5,base-height*.36,p.x+lean*.6+k*thick*.3,top+height*.36,p.x+lean*.7+k*thick*.2,top+height*.16);ctx.stroke()}ctx.strokeStyle='rgba(19,23,17,.78)';ctx.lineWidth=Math.max(.5,thick*.32);for(let side of [-1,1]){ctx.beginPath();ctx.moveTo(p.x+side*thick*.2,base);ctx.quadraticCurveTo(p.x+side*thick*1.7,base-thick,p.x+side*thick*2.6,base+1);ctx.stroke()}}
      if(tree.kind<.24){ // Conifer: tiered, irregular needle boughs.
        const tiers=s>7?7:4;for(let j=0;j<tiers;j++){const f=.18+j*.105,y=top+height*f,spread=crownW*(.35+j*.21),branchY=y+height*.11;ctx.fillStyle=palette[Math.min(3,Math.floor((j/tiers)*3.4))];ctx.beginPath();ctx.moveTo(p.x+lean*f,y-height*.09);ctx.lineTo(p.x+lean*f-spread,branchY);ctx.lineTo(p.x+lean*f-spread*.48,branchY-height*.035);ctx.lineTo(p.x+lean*f,branchY+height*.018);ctx.lineTo(p.x+lean*f+spread*.53,branchY-height*.025);ctx.lineTo(p.x+lean*f+spread,branchY);ctx.closePath();ctx.fill();ctx.strokeStyle='rgba(156,170,113,.2)';ctx.lineWidth=Math.max(.4,s*.025);ctx.beginPath();ctx.moveTo(p.x+lean*f,y);ctx.lineTo(p.x+lean*f-spread*.75,branchY-height*.01);ctx.moveTo(p.x+lean*f,y);ctx.lineTo(p.x+lean*f+spread*.78,branchY-height*.01);ctx.stroke();if(season==='winter'&&j%2===0){ctx.strokeStyle='rgba(235,238,230,.67)';ctx.lineWidth=Math.max(.6,s*.035);ctx.beginPath();ctx.moveTo(p.x+lean*f-spread*.66,branchY);ctx.lineTo(p.x+lean*f-spread*.25,branchY+height*.018);ctx.lineTo(p.x+lean*f+spread*.35,branchY+height*.005);ctx.stroke()}}}
      else { // Broadleaf: asymmetrical masses, small light-catching leaf clusters.
        const clusters=s>9?10:6;for(let i=0;i<clusters;i++){const a=i*2.399+tree.seed*10,rad=.15+(i%4)*.14,cx=p.x+lean+Math.cos(a)*crownW*rad,cy=top+height*(.18+((i*7)%13)/37)+Math.sin(a)*height*.09,rx=crownW*(.28+(i%3)*.105),ry=height*(.036+(i%3)*.012),baseColor=palette[(i+Math.floor(tree.tone*3))%palette.length];ctx.fillStyle=baseColor;ctx.beginPath();ctx.ellipse(cx,cy,rx,ry,a*.08,0,TAU);ctx.fill();if(s>4){ctx.fillStyle=season==='winter'?'rgba(222,229,221,.4)':season==='autumn'?'rgba(248,192,103,.28)':'rgba(202,211,144,.18)';ctx.beginPath();ctx.ellipse(cx-rx*.2,cy-ry*.25,rx*.53,ry*.24,a*.08,0,TAU);ctx.fill()}}
        if(season==='winter'&&s>2){ctx.strokeStyle='rgba(205,216,210,.56)';ctx.lineWidth=Math.max(.45,s*.025);for(let b=0;b<5;b++){const x=p.x+lean+(b-2)*crownW*.26;ctx.beginPath();ctx.moveTo(p.x+lean,top+height*.42);ctx.quadraticCurveTo(x,top+height*.25,x+(b-2)*crownW*.08,top+height*.16);ctx.stroke()}}}
      const haze=Math.max(0,Math.min(.38,(depth-60)/220));if(haze){ctx.fillStyle=`rgba(195,204,186,${haze})`;ctx.beginPath();ctx.ellipse(p.x,top+height*.34,crownW*1.15,height*.1,0,0,TAU);ctx.fill()}}
    function drawUnderstory(){for(let i=0;i<groundDetails.length;i+=2){const item=groundDetails[i];let d=((item.z-camera.z)%105+105)%105;if(d<2)d+=105;const side=item.x<0?-1:1,c=path(camera.z+d)-path(camera.z),p=project(c+side*(1.8+Math.abs(item.x)*.5),d);if(!p||p.y<h*.47)continue;const size=Math.max(.5,item.size*p.scale*.18);ctx.fillStyle=season==='autumn'?'rgba(111,83,42,.75)':season==='winter'?'rgba(103,120,112,.7)':'rgba(47,68,39,.78)';ctx.beginPath();ctx.ellipse(p.x,p.y,size*1.8,size*.5,item.angle,0,TAU);ctx.fill();if(size>2){ctx.strokeStyle=season==='winter'?'rgba(184,197,186,.5)':'rgba(119,139,78,.5)';ctx.lineWidth=.6;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-size*1.7,p.y-size*.8);ctx.moveTo(p.x,p.y);ctx.lineTo(p.x+size*1.4,p.y-size*.65);ctx.stroke()}}}
    function drawAtmosphere(){const s=seasons[season],g=ctx.createLinearGradient(0,h*.42,0,h*.85);g.addColorStop(0,'rgba(205,216,195,0)');g.addColorStop(.55,s.snow?'rgba(224,233,238,.18)':'rgba(205,216,195,.12)');g.addColorStop(1,'rgba(205,216,195,0)');ctx.fillStyle=g;ctx.fillRect(0,h*.4,w,h*.45)}
    function drawParticles(dt){const s=seasons[season];ctx.save();for(const p of particles){p.y+=p.speed*dt*.035;p.x+=p.drift*dt*.025;if(p.y>h+6){p.y=-6;p.x=Math.random()*w}if(p.x<0)p.x=w;if(p.x>w)p.x=0;ctx.globalAlpha=p.alpha;ctx.fillStyle=s.particle;if(s.snow){ctx.beginPath();ctx.arc(p.x,p.y,p.size*.65,0,TAU);ctx.fill()}else if(season==='autumn'||season==='spring'){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.phase+p.y*.01);ctx.beginPath();ctx.ellipse(0,0,p.size*1.4,p.size*.55,0,0,TAU);ctx.fill();ctx.restore()}else{ctx.beginPath();ctx.arc(p.x,p.y,p.size*.4,0,TAU);ctx.fill()}}ctx.restore()}
    function render(now){requestAnimationFrame(render);if(now-lastFrame<55)return;const dt=Math.min(90,now-lastFrame||55);lastFrame=now;camera.yaw+=(camera.targetYaw-camera.yaw)*.08;drawSky();drawTrail();const visible=trees.map(tree=>({tree,depth:((tree.z-camera.z)%190+190)%190||190})).sort((a,b)=>b.depth-a.depth);for(const item of visible)drawTree(item.tree,item.depth);drawUnderstory();drawAtmosphere();drawParticles(dt)}
    function move(){camera.z+=7.5;locationLabel.textContent=seasons[season].label+' · '+['林间小径','深林深处','林间转弯','苔石小路','林间幽径','无尽林海'][Math.floor(camera.z/7.5)%6];document.body.classList.add('show-label');clearTimeout(move.timer);move.timer=setTimeout(()=>document.body.classList.remove('show-label'),950)}
    scene.addEventListener('click',e=>{if(drag?.moved)return;move();camera.targetYaw=Math.max(-.55,Math.min(.55,camera.targetYaw+(e.clientX/w-.5)*.1))});scene.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,lastX:e.clientX,lastY:e.clientY,moved:false};scene.setPointerCapture?.(e.pointerId)});scene.addEventListener('pointermove',e=>{if(!drag)return;if(Math.abs(e.clientX-drag.x)>5||Math.abs(e.clientY-drag.y)>5)drag.moved=true;if(drag.moved)camera.targetYaw=Math.max(-.65,Math.min(.65,camera.targetYaw-(e.clientX-drag.lastX)/w*.9));drag.lastX=e.clientX;drag.lastY=e.clientY});scene.addEventListener('pointerup',()=>{if(drag?.moved)setTimeout(()=>drag=null,0);else drag=null});scene.addEventListener('pointercancel',()=>drag=null);
    window.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','w','a','s','d',' '].includes(e.key)){e.preventDefault();if(e.key==='ArrowLeft'||e.key==='a')camera.targetYaw=Math.max(-.65,camera.targetYaw-.08);else if(e.key==='ArrowRight'||e.key==='d')camera.targetYaw=Math.min(.65,camera.targetYaw+.08);else move()}});
    function toggleSound(){if(!audio){const AudioContext=window.AudioContext||window.webkitAudioContext;if(!AudioContext)return;audio=new AudioContext();const master=audio.createGain();master.gain.value=.025;master.connect(audio.destination);[130,196,293.66,392].forEach((freq,i)=>{const osc=audio.createOscillator(),gain=audio.createGain();osc.type=i?'sine':'triangle';osc.frequency.value=freq;gain.gain.value=i?.018:.09;osc.connect(gain);gain.connect(master);osc.start()});const buffer=audio.createBuffer(1,audio.sampleRate*2,audio.sampleRate),data=buffer.getChannelData(0);for(let i=0;i<data.length;i++)data[i]=(Math.random()*2-1)*.1;const noise=audio.createBufferSource(),filter=audio.createBiquadFilter(),gain=audio.createGain();noise.buffer=buffer;noise.loop=true;filter.type='lowpass';filter.frequency.value=600;gain.gain.value=.16;noise.connect(filter);filter.connect(gain);gain.connect(master);noise.start()}const enabled=sound.getAttribute('aria-pressed')!=='true';sound.setAttribute('aria-pressed',String(enabled));soundText.textContent=enabled?'关闭':'声音';enabled?audio.resume():audio.suspend()}
    sound.addEventListener('click',toggleSound);window.addEventListener('resize',resize);resize();requestAnimationFrame(render);
  })();
  </script>
