<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3efe7">
  <meta name="description" content="油画笔触般的四季森林与蜿蜒小径。">
  <title>林间漫游</title>
  <style>
    :root{color-scheme:light;--ink:#344033;--paper:#f3efe7;--glass:rgba(248,246,239,.8)}
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--paper);color:var(--ink)}
    body{font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;user-select:none;-webkit-font-smoothing:antialiased}
    .scene{position:fixed;inset:0;overflow:hidden;touch-action:none;cursor:crosshair;background:#f3efe7}canvas{display:block;width:100%;height:100%}
    .paper{position:fixed;inset:0;pointer-events:none;opacity:.12;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 160 160' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.16'/%3E%3C/svg%3E")}
    header{position:fixed;z-index:2;inset:18px 24px auto;display:flex;justify-content:space-between;align-items:center;gap:12px;pointer-events:none}.brand{font-size:10px;letter-spacing:.25em;color:rgba(43,54,42,.62)}
    .seasons{pointer-events:auto;display:flex;gap:3px;padding:4px;border:1px solid rgba(71,81,62,.17);border-radius:24px;background:var(--glass);backdrop-filter:blur(8px)}.season{border:0;border-radius:20px;padding:8px 11px;background:transparent;color:#4c5946;font:12px inherit;cursor:pointer}.season[aria-pressed="true"]{background:#647b50;color:white}.season:focus-visible{outline:2px solid #718a58;outline-offset:2px}
    .footer{position:fixed;z-index:2;left:25px;right:25px;bottom:20px;display:flex;justify-content:space-between;align-items:end;color:rgba(43,54,42,.67);font-size:10px;letter-spacing:.14em;pointer-events:none;text-shadow:0 1px 5px rgba(255,255,255,.55)}.status:before{content:"";display:inline-block;width:25px;height:1px;margin:0 9px 3px 0;background:currentColor}.hint{text-align:right;line-height:1.8}
    @media(max-width:600px){header{inset:max(14px,env(safe-area-inset-top)) 14px auto}.brand{font-size:8px;letter-spacing:.12em}.season{padding:7px 8px;font-size:11px}.footer{left:16px;right:16px;bottom:max(15px,env(safe-area-inset-bottom));font-size:8px}}
  </style>
</head>
<body>
  <div class="scene" id="scene" aria-label="油画笔触风格的四季森林小路，可点击前行或拖动视角"><canvas id="view"></canvas></div>
  <div class="paper"></div>
  <header><div class="brand">A QUIET WALK · 林间漫游</div><div class="seasons" role="group" aria-label="选择季节"><button class="season" data-season="spring" aria-pressed="false">春</button><button class="season" data-season="summer" aria-pressed="true">夏</button><button class="season" data-season="autumn" aria-pressed="false">秋</button><button class="season" data-season="winter" aria-pressed="false">冬</button></div></header>
  <footer class="footer"><div class="status" id="status">夏日 · 林间小径</div><div class="hint">点击小路前行 · 拖动视角<br>方向键也可漫步</div></footer>
  <script>
  (()=>{
    'use strict';
    const view=document.getElementById('view'),screen=view.getContext('2d',{alpha:false}),scene=document.getElementById('scene'),status=document.getElementById('status');
    const art=document.createElement('canvas'),paint=art.getContext('2d',{alpha:false});
    const TAU=Math.PI*2;
    const seasons={
      spring:{label:'春',sky:['#f8f5ed','#edf0df','#dfe7cc'],leaf:['#c5df70','#a5c958','#79a94b','#527f42'],deep:['#6d9252','#4f7547','#3a5d3c'],ground:'#c4b995',edge:'#a3a273',litter:['#d8b7a3','#bacb78','#ddd19b'],air:'#dbe3c9',fall:'#efd4ce'},
      summer:{label:'夏',sky:['#f5f2e9','#e7ecd9','#d5e0c8'],leaf:['#b8d64e','#91bf49','#6e9f40','#476f38'],deep:['#5c8047','#466c3e','#355738'],ground:'#b6a37e',edge:'#8e9467',litter:['#c7bd91','#8f845f','#71804b'],air:'#d8e0cb',fall:'#e8d98f'},
      autumn:{label:'秋',sky:['#f7efe3','#f0e2c9','#dec9a8'],leaf:['#e2b64d','#d58d3f','#bd6937','#8d4e32'],deep:['#a5763e','#805b38','#5d4434'],ground:'#b4956c',edge:'#927650',litter:['#d48b48','#c16a3e','#987343'],air:'#ead4b3',fall:'#d89153'},
      winter:{label:'冬',sky:['#f0f3f1','#e4ebea','#d4dfe0'],leaf:['#aab9ad','#849a8d','#6d857b','#536c64'],deep:['#70887e','#566f68','#415b55'],ground:'#c4c9c4',edge:'#a0aaa2',litter:['#e5e8e2','#bac7c3','#8d9b95'],air:'#e3ebec',fall:'#fff'}
    };
    let season='summer',w=0,h=0,dpr=1,seed=55121,trees=[],debris=[],particles=[],cameraX=0,targetX=0,cameraZ=0,drag=null,lastFrame=0,needsDraw=true;
    const rand=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296};
    const hash=n=>{const x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x)};
    function makeWorld(){seed=55121;trees=[];debris=[];const count=Math.min(65,Math.max(34,Math.round(w*h/15000)));for(let i=0;i<count;i++)trees.push({side:rand()<.5?-1:1,offset:2.9+rand()*19,depth:5+rand()*145,height:6+rand()*12,radius:1.2+rand()*2.2,kind:rand(),tone:rand(),seed:rand()*10000,lean:(rand()-.5)*.24,bark:rand()});for(let i=0;i<145;i++)debris.push({depth:2+rand()*110,x:(rand()-.5)*11,size:.3+rand()*1.3,angle:rand()*TAU,tone:rand(),leaf:rand()<.65});resetParticles()}
    function resize(){const box=view.getBoundingClientRect();w=box.width;h=box.height;dpr=Math.min(window.devicePixelRatio||1,1.15);view.width=Math.max(1,Math.round(w*dpr));view.height=Math.max(1,Math.round(h*dpr));screen.setTransform(dpr,0,0,dpr,0,0);art.width=Math.max(1,Math.round(w*dpr));art.height=Math.max(1,Math.round(h*dpr));paint.setTransform(dpr,0,0,dpr,0,0);makeWorld();needsDraw=true}
    function resetParticles(){const n=season==='winter'?16:season==='autumn'?11:season==='spring'?8:3;particles=Array.from({length:n},()=>({x:rand()*w,y:rand()*h,speed:.15+rand()*.45,drift:(rand()-.5)*.25,size:.7+rand()*1.4,rot:rand()*TAU,alpha:.22+rand()*.36}))}
    function setSeason(value){if(!seasons[value])return;season=value;document.querySelectorAll('.season').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.season===value)));status.textContent=seasons[season].label+' · 林间小径';resetParticles();needsDraw=true}
    document.querySelectorAll('.season').forEach(b=>b.addEventListener('click',()=>setSeason(b.dataset.season)));
    function pathAt(z){return Math.sin(z*.019)*8.8+Math.sin(z*.047+1.1)*1.8+Math.sin(z*.008)*3.2}
    function project(x,depth,y=0){const focal=h*.78,forward=depth;if(forward<1)return null;const scale=focal/forward;return{x:w*.5+(x-cameraX)*scale,y:h*.49+(1.35-y)*scale,scale,depth}}
    function polygon(points,color){paint.fillStyle=color;paint.beginPath();for(let i=0;i<points.length;i++){const p=points[i];i?paint.lineTo(p.x,p.y):paint.moveTo(p.x,p.y)}paint.closePath();paint.fill()}
    function drawBackground(){const p=seasons[season],g=paint.createLinearGradient(0,0,0,h);g.addColorStop(0,p.sky[0]);g.addColorStop(.47,p.sky[1]);g.addColorStop(1,p.sky[2]);paint.fillStyle=g;paint.fillRect(0,0,w,h);const glow=paint.createRadialGradient(w*.52,h*.35,2,w*.52,h*.35,h*.55);glow.addColorStop(0,'rgba(255,255,236,.58)');glow.addColorStop(.45,'rgba(248,239,199,.15)');glow.addColorStop(1,'rgba(248,239,199,0)');paint.fillStyle=glow;paint.fillRect(0,0,w,h);for(let layer=0;layer<4;layer++){const y=h*(.34+layer*.045);paint.beginPath();paint.moveTo(0,h);for(let x=0;x<=w+14;x+=22)paint.lineTo(x,y+Math.sin(x*.009+layer*2.8)*h*.021+Math.sin(x*.025+layer)*h*.009);paint.lineTo(w,h);paint.closePath();paint.fillStyle=['rgba(140,165,117,.12)','rgba(108,142,88,.19)','rgba(83,119,70,.24)','rgba(61,94,58,.28)'][layer];paint.fill()}}
    function drawTrail(){const p=seasons[season],left=[],right=[],outerL=[],outerR=[];for(let i=0;i<=58;i++){const d=2+i*2.35,c=pathAt(cameraZ+d)-pathAt(cameraZ),half=.86+d*.029,a=project(c-half,d),b=project(c+half,d),oa=project(c-half*1.27,d),ob=project(c+half*1.27,d);if(a&&b&&oa&&ob){left.push(a);right.push(b);outerL.push(oa);outerR.push(ob)}}if(left.length<2)return;polygon([...outerL,...outerR.slice().reverse()],p.edge);polygon([...left,...right.slice().reverse()],p.ground);
      // Broad translucent strokes are baked once into the cached painting.
      for(let side of [-1,1]){paint.beginPath();let started=false;for(let i=0;i<=38;i++){const d=3+i*3.4,c=pathAt(cameraZ+d)-pathAt(cameraZ),q=project(c+side*(.6+d*.02),d,.02);if(!q)continue;if(!started){paint.moveTo(q.x,q.y);started=true}else paint.lineTo(q.x,q.y)}paint.strokeStyle='rgba(92,78,56,.19)';paint.lineWidth=1.2;paint.stroke()}
      for(const bit of debris){let d=((bit.depth-cameraZ)%110+110)%110;if(d<2)d+=110;const c=pathAt(cameraZ+d)-pathAt(cameraZ),q=project(c+bit.x*(.32+d*.012),d,.025);if(!q||q.y<h*.51)continue;const size=Math.min(8,Math.max(.5,bit.size*q.scale*.13));paint.save();paint.translate(q.x,q.y);paint.rotate(bit.angle);paint.fillStyle=bit.leaf?p.litter[Math.floor(bit.tone*p.litter.length)]:'rgba(101,94,73,.3)';paint.beginPath();paint.ellipse(0,0,size*(bit.leaf?1.55:1),size*.5,0,0,TAU);paint.fill();if(bit.leaf){paint.strokeStyle='rgba(86,75,54,.27)';paint.lineWidth=.5;paint.beginPath();paint.moveTo(-size,0);paint.lineTo(size,0);paint.stroke()}paint.restore()}}
    function drawTrunk(x,top,base,tw,height,tree){const g=paint.createLinearGradient(x-tw,0,x+tw,0);g.addColorStop(0,'#614531');g.addColorStop(.25,tree.bark>.5?'#b08353':'#96704b');g.addColorStop(.52,'#704a32');g.addColorStop(.8,'#a47a4e');g.addColorStop(1,'#59402f');paint.fillStyle=g;paint.beginPath();paint.moveTo(x-tw*1.5,base+1);paint.bezierCurveTo(x-tw*.6,base-height*.18,x-tw*.55,top+height*.3,x-tw*.25,top);paint.quadraticCurveTo(x,top-height*.04,x+tw*.28,top);paint.bezierCurveTo(x+tw*.55,top+height*.34,x+tw*.7,base-height*.16,x+tw*1.4,base+1);paint.closePath();paint.fill();if(height>15){for(let k=-1;k<=1;k++){paint.strokeStyle=k?'rgba(220,178,125,.3)':'rgba(55,38,28,.32)';paint.lineWidth=Math.max(.4,tw*.13);paint.beginPath();paint.moveTo(x+k*tw*.3,base-height*.04);paint.bezierCurveTo(x+k*tw*.1,base-height*.38,x+k*tw*.32,top+height*.38,x+k*tw*.16,top+height*.08);paint.stroke()}paint.strokeStyle='rgba(73,48,31,.54)';paint.lineWidth=Math.max(.5,tw*.3);for(const s of [-1,1]){paint.beginPath();paint.moveTo(x+s*tw*.18,base);paint.quadraticCurveTo(x+s*tw*1.3,base-tw,x+s*tw*2.1,base+1);paint.stroke()}}}
    function brushCrown(cx,cy,rx,ry,tree,palette){const seed=tree.seed,lobes=8+Math.floor(hash(seed+7)*6),phase=hash(seed+11)*TAU;paint.beginPath();for(let i=0;i<=lobes*4;i++){const a=phase+i/lobes/4*TAU,r=.8+.15*Math.sin(a*3+seed)+.12*Math.sin(a*7+seed*.31)+.05*Math.cos(a*11+seed);const x=cx+Math.cos(a)*rx*r,y=cy+Math.sin(a)*ry*(.82+.18*Math.sin(a*4+seed*.2));i?paint.lineTo(x,y):paint.moveTo(x,y)}paint.closePath();paint.fillStyle=palette[Math.floor(hash(seed+3)*palette.length)];paint.fill();
      // Irregular impasto dabs are tapered, locally oriented, and seeded per tree (no frame-to-frame flicker).
      const strokes=Math.min(34,Math.max(8,Math.round(rx*.62)));for(let i=0;i<strokes;i++){const u=hash(seed+i*13.7)*1.8-.9,v=hash(seed+i*19.3)*1.7-.85;if(u*u+v*v>.93)continue;const px=cx+u*rx*.84,py=cy+v*ry*.78,len=(.07+hash(seed+i*31.1)*.17)*rx,angle=-.56+u*.44+Math.sin(v*3+seed)*.2,thick=Math.max(.55,ry*(.035+hash(seed+i*41.7)*.035));paint.strokeStyle=palette[Math.floor(hash(seed+i*7.9+5)*palette.length)];paint.globalAlpha=.48+hash(seed+i*23)*.38;paint.lineWidth=thick;paint.lineCap='round';paint.beginPath();paint.moveTo(px-len*.5*Math.cos(angle),py-len*.5*Math.sin(angle));paint.quadraticCurveTo(px+Math.sin(i)*thick,py-thick*.8,px+len*.5*Math.cos(angle),py+len*.5*Math.sin(angle));paint.stroke()}paint.globalAlpha=1;
      for(let i=0;i<Math.max(3,Math.round(strokes*.14));i++){const u=hash(seed+i*51+99)*1.4-.92,v=hash(seed+i*17+201)*1.2-.8;if(u*u+v*v>1)continue;const px=cx+u*rx*.8,py=cy+v*ry*.7,len=rx*(.03+hash(seed+i*71)*.07);paint.strokeStyle=season==='autumn'?'rgba(255,213,135,.62)':season==='winter'?'rgba(239,244,238,.5)':'rgba(239,247,153,.58)';paint.lineWidth=Math.max(.5,ry*.03);paint.lineCap='round';paint.beginPath();paint.moveTo(px-len*.5,py);paint.quadraticCurveTo(px,py-ry*.03,px+len*.5,py-ry*.02);paint.stroke()}}
    function drawTree(tree,depth){const c=pathAt(cameraZ+depth)-pathAt(cameraZ),point=project(c+tree.side*tree.offset,depth);if(!point||point.x<-w*.2||point.x>w*1.2)return;const s=point.scale,height=tree.height*s;if(height<1.6)return;const base=point.y,top=base-height,tw=Math.max(.65,tree.radius*s*.24),lean=tree.lean*height,canopyW=Math.max(2,tree.radius*s*1.6),p=seasons[season];drawTrunk(point.x,top+height*.16,base,tw,height,tree);
      const branches=tree.kind<.2?3:2;paint.strokeStyle='#765039';paint.lineCap='round';for(let b=0;b<branches;b++){const side=b%2?1:-1,startY=base-height*(.49+b*.1),sx=point.x+lean*.35,reach=canopyW*(.55+hash(tree.seed+b)*.35),endX=point.x+lean+side*reach,endY=top+height*(.18+hash(tree.seed+b+8)*.16);paint.lineWidth=Math.max(.5,tw*(.46-b*.08));paint.beginPath();paint.moveTo(sx,startY);paint.bezierCurveTo(sx+side*reach*.2,startY-height*.1,endX-side*reach*.25,endY+height*.06,endX,endY);paint.stroke()}
      if(tree.kind<.2){const layers=3+Math.floor(hash(tree.seed+44)*3);for(let j=0;j<layers;j++){const f=.17+j*.12,cy=top+height*f,rx=canopyW*(.32+j*.18),ry=height*(.16-j*.012);paint.beginPath();paint.moveTo(point.x+lean*f,cy-ry);paint.bezierCurveTo(point.x+lean*f-rx*.2,cy-ry*.65,point.x+lean*f-rx*.78,cy-ry*.1,point.x+lean*f-rx,cy+ry*.35);paint.quadraticCurveTo(point.x+lean*f-rx*.3,cy+ry*.12,point.x+lean*f,cy+ry*.55);paint.quadraticCurveTo(point.x+lean*f+rx*.36,cy+ry*.12,point.x+lean*f+rx,cy+ry*.3);paint.bezierCurveTo(point.x+lean*f+rx*.72,cy-ry*.3,point.x+lean*f+rx*.25,cy-ry*.86,point.x+lean*f,cy-ry);paint.closePath();paint.fillStyle=p.deep[Math.min(2,Math.floor(j/2))];paint.fill();paint.strokeStyle='rgba(213,223,160,.28)';paint.lineWidth=Math.max(.4,s*.02);paint.beginPath();paint.moveTo(point.x+lean*f,cy-ry*.24);paint.lineTo(point.x+lean*f-rx*.68,cy+ry*.28);paint.moveTo(point.x+lean*f,cy-ry*.24);paint.lineTo(point.x+lean*f+rx*.7,cy+ry*.24);paint.stroke()}}
      else{const crowns=tree.kind>.8?3:tree.kind>.52?2:1;for(let i=0;i<crowns;i++){const cx=point.x+lean+(i-(crowns-1)/2)*canopyW*.39,cy=top+height*(.2+hash(tree.seed+i*8)*.11),rx=canopyW*(crowns===1?1:.62)*(1+hash(tree.seed+i*3)*.24),ry=height*(.23+hash(tree.seed+i*21)*.065);brushCrown(cx,cy,rx,ry,{seed:tree.seed+i*109.31},p.leaf)}}
      const haze=Math.max(0,Math.min(.24,(depth-76)/245));if(haze){paint.fillStyle=`rgba(238,237,214,${haze})`;paint.beginPath();paint.ellipse(point.x,top+height*.35,canopyW,height*.1,0,0,TAU);paint.fill()}}
    function drawPainting(){paint.setTransform(dpr,0,0,dpr,0,0);drawBackground();drawTrail();const ordered=trees.map(tree=>({tree,depth:((tree.depth-cameraZ)%150+150)%150||150})).sort((a,b)=>b.depth-a.depth);for(const item of ordered)drawTree(item.tree,item.depth);const p=seasons[season];const haze=paint.createLinearGradient(0,h*.4,0,h*.86);haze.addColorStop(0,'rgba(232,237,218,0)');haze.addColorStop(.6,season==='winter'?'rgba(230,237,239,.28)':'rgba(225,234,207,.2)');haze.addColorStop(1,'rgba(232,237,218,0)');paint.fillStyle=haze;paint.fillRect(0,h*.4,w,h*.46);needsDraw=false}
    function updateParticles(dt){const p=seasons[season];screen.save();for(const item of particles){item.y+=item.speed*dt*.025;item.x+=item.drift*dt*.025;if(item.y>h+6){item.y=-6;item.x=rand()*w}if(item.x<0)item.x=w;if(item.x>w)item.x=0;screen.globalAlpha=item.alpha;screen.fillStyle=season==='winter'?'#fff':p.fall;if(season==='autumn'||season==='spring'){screen.save();screen.translate(item.x,item.y);screen.rotate(item.rot+item.y*.005);screen.beginPath();screen.ellipse(0,0,item.size*1.4,item.size*.48,0,0,TAU);screen.fill();screen.restore()}else{screen.beginPath();screen.arc(item.x,item.y,item.size*.45,0,TAU);screen.fill()}}screen.restore()}
    function render(now){requestAnimationFrame(render);if(now-lastFrame<66)return;const dt=Math.min(100,now-lastFrame||66);lastFrame=now;cameraX+=(targetX-cameraX)*.12;if(needsDraw)drawPainting();screen.setTransform(dpr,0,0,dpr,0,0);screen.clearRect(0,0,w,h);const moved=Math.abs(targetX-cameraX)>.15;const zoom=1+Math.abs(cameraX)*.002;screen.save();screen.translate(cameraX,0);screen.translate(-cameraX,0);screen.translate(w*.5,h*.5);screen.scale(zoom,zoom);screen.translate(-w*.5,-h*.5);screen.drawImage(art,0,0,art.width,art.height,0,0,w,h);screen.restore();updateParticles(dt);if(moved)needsDraw=false}
    function walk(){cameraZ+=5;targetX=Math.max(-28,Math.min(28,targetX+(Math.random()-.5)*7));needsDraw=true;const names=['林间小径','深林深处','林间转弯','苔石小路','林间幽径','无尽林海'];status.textContent=seasons[season].label+' · '+names[Math.floor(cameraZ/5)%names.length]}
    scene.addEventListener('pointerdown',e=>{drag={x:e.clientX,lastX:e.clientX,moved:false};scene.setPointerCapture?.(e.pointerId)});scene.addEventListener('pointermove',e=>{if(!drag)return;if(Math.abs(e.clientX-drag.x)>5)drag.moved=true;if(drag.moved)targetX=Math.max(-75,Math.min(75,targetX-(e.clientX-drag.lastX)*.35));drag.lastX=e.clientX});scene.addEventListener('pointerup',()=>{if(drag&&!drag.moved)walk();drag=null});scene.addEventListener('pointercancel',()=>drag=null);
    window.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' ','w','a','s','d'].includes(e.key)){e.preventDefault();if(e.key==='ArrowLeft'||e.key==='a')targetX=Math.max(-75,targetX-14);else if(e.key==='ArrowRight'||e.key==='d')targetX=Math.min(75,targetX+14);else walk()}});
    window.addEventListener('resize',resize);resize();requestAnimationFrame(render);
  })();
  </script>
</body>
</html>
