<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101710">
  <meta name="description" content="走进静谧森林，沿着由 JavaScript 实时绘制的蜿蜒小路自由探索。">
  <title>林间 · 一场无尽的漫步</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Noto+Serif+SC:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root{color-scheme:dark;--cream:#f2efe5;--muted:rgba(242,239,229,.67);--serif:'Noto Serif SC',Georgia,serif;--sans:'DM Sans',sans-serif}
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#101a14;color:var(--cream)}
    body{font-family:var(--sans);-webkit-font-smoothing:antialiased;user-select:none}
    .scene{position:fixed;inset:0;overflow:hidden;cursor:crosshair;touch-action:none;background:#14221a}
    canvas{display:block;width:100%;height:100%}
    .shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(8,15,11,.35),transparent 25%,transparent 57%,rgba(7,13,9,.5)),radial-gradient(ellipse at 50% 43%,transparent 32%,rgba(4,9,6,.22) 78%,rgba(4,8,6,.54) 130%)}
    header{position:fixed;z-index:2;top:0;left:0;right:0;padding:clamp(24px,4vw,48px) clamp(24px,5vw,72px);display:flex;align-items:center;justify-content:space-between;pointer-events:none}
    .brand{font-size:11px;letter-spacing:.23em;text-transform:uppercase;color:rgba(242,239,229,.8)}
    .sound{pointer-events:auto;color:inherit;display:flex;align-items:center;gap:10px;border:1px solid rgba(255,255,255,.28);background:rgba(16,23,17,.24);backdrop-filter:blur(12px);border-radius:100px;padding:10px 15px;font:500 11px var(--sans);letter-spacing:.1em;cursor:pointer;transition:background .2s,border-color .2s}
    .sound:hover,.sound:focus-visible{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.6);outline:none}
    .sound-icon{width:14px;height:14px;display:flex;align-items:center;justify-content:center;gap:2px}.sound-icon i{display:block;width:2px;height:5px;border-radius:2px;background:currentColor;transition:height .2s}
    .sound[aria-pressed="true"] .sound-icon i:nth-child(1){height:8px}.sound[aria-pressed="true"] .sound-icon i:nth-child(2){height:13px}.sound[aria-pressed="true"] .sound-icon i:nth-child(3){height:6px}.sound[aria-pressed="true"] .sound-icon i:nth-child(4){height:10px}
    main{position:fixed;z-index:1;inset:0;display:grid;place-items:center;text-align:center;pointer-events:none;padding:90px 24px 120px}
    .title{margin:0 0 14px;font:400 clamp(36px,6.8vw,82px)/1.28 var(--serif);letter-spacing:.16em;text-indent:.16em;text-shadow:0 2px 32px rgba(0,0,0,.4)}
    .subtitle{margin:0;color:rgba(245,242,231,.82);font:400 clamp(12px,1.4vw,15px)/2 var(--serif);letter-spacing:.3em;text-indent:.3em}
    .start{pointer-events:auto;margin-top:38px;display:inline-flex;align-items:center;gap:13px;border:1px solid rgba(255,255,255,.58);border-radius:100px;padding:14px 23px;color:#fff;text-decoration:none;background:rgba(22,31,23,.28);backdrop-filter:blur(8px);font:400 12px var(--sans);letter-spacing:.18em;cursor:pointer;transition:background .3s,transform .3s,border-color .3s}
    .start:hover,.start:focus-visible{background:rgba(255,255,255,.16);border-color:#fff;transform:translateY(-2px);outline:none}.start svg{width:14px;height:14px;transition:transform .3s}.start:hover svg{transform:translateX(4px)}
    .bottom{position:fixed;z-index:2;left:0;right:0;bottom:0;padding:26px clamp(24px,5vw,72px) max(26px,env(safe-area-inset-bottom));display:flex;align-items:flex-end;justify-content:space-between;color:var(--muted);font-size:10px;letter-spacing:.16em;text-transform:uppercase;pointer-events:none}
    .location{display:flex;align-items:center;gap:10px}.location:before{content:"";height:1px;width:28px;background:rgba(242,239,229,.6)}
    .hint{display:flex;align-items:center;gap:9px;text-align:right}.mouse{width:15px;height:22px;border:1px solid rgba(242,239,229,.64);border-radius:9px;position:relative}.mouse:after{content:"";position:absolute;width:2px;height:4px;left:5px;top:4px;border-radius:2px;background:currentColor;animation:scroll 1.6s ease infinite}
    @keyframes scroll{0%{transform:translateY(0);opacity:1}100%{transform:translateY(6px);opacity:0}}
    .progress{position:fixed;z-index:3;left:50%;bottom:82px;transform:translateX(-50%);width:74px;height:1px;background:rgba(255,255,255,.25);opacity:0;transition:opacity .5s;pointer-events:none}.progress span{display:block;width:0;height:100%;background:#fff;transition:width .5s}
    .walking .hero{opacity:0;transform:translateY(-12px);pointer-events:none}.hero{transition:opacity .65s,transform .65s}.walking .progress{opacity:1}
    .walk-label{position:fixed;z-index:2;top:50%;left:50%;transform:translate(-50%,-50%);font:400 12px var(--serif);letter-spacing:.28em;color:rgba(255,255,255,.83);opacity:0;transition:opacity .4s;pointer-events:none;text-shadow:0 2px 12px #000}.walking.show-label .walk-label{opacity:1}
    @media(max-width:600px){header{padding-top:max(22px,env(safe-area-inset-top))}.brand{font-size:9px}.sound{padding:9px 12px;font-size:9px}.bottom{font-size:8px;padding-bottom:max(22px,env(safe-area-inset-bottom))}.title{letter-spacing:.11em;text-indent:.11em}.subtitle{letter-spacing:.2em;text-indent:.2em}.hint{max-width:145px;line-height:1.8}.progress{bottom:76px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <div class="scene" id="scene" aria-label="由 JavaScript 绘制的可交互森林小路场景"><canvas id="forest" aria-label="实时生成的森林、雾气与蜿蜒小路"></canvas><div class="shade"></div></div>
  <header><div class="brand">A QUIET WALK · 林间漫游</div><button class="sound" id="sound" type="button" aria-pressed="false" aria-label="开启森林环境音"><span class="sound-icon" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span id="soundText">开启声音</span></button></header>
  <main><section class="hero" id="hero"><h1 class="title">林间漫游</h1><p class="subtitle">让思绪，沿着小路慢慢走远</p><button class="start" id="start" type="button">踏入森林 <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M2.5 8h10m-4-4 4 4-4 4" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button></section></main>
  <div class="walk-label" id="walkLabel">沿着小路，继续向前</div><div class="progress" aria-hidden="true"><span id="progressBar"></span></div>
  <footer class="bottom"><div class="location" id="location">宁静 · 林间小径</div><div class="hint"><span class="mouse" aria-hidden="true"></span><span>点击前行 · 拖动视角<br>或使用方向键漫步</span></div></footer>
  <script>
  (()=>{
    const canvas=document.getElementById('forest'),ctx=canvas.getContext('2d',{alpha:false}),scene=document.getElementById('scene');
    const start=document.getElementById('start'),sound=document.getElementById('sound'),soundText=document.getElementById('soundText'),bar=document.getElementById('progressBar'),locationLabel=document.getElementById('location');
    const TAU=Math.PI*2;let w=0,h=0,dpr=1,seed=7319,trees=[],plants=[],camera={z:0,x:0,yaw:0,targetYaw:0},walking=false,drag=null,audio=null,frame=0;
    function rand(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}
    function resize(){const r=canvas.getBoundingClientRect();w=r.width;h=r.height;dpr=Math.min(devicePixelRatio||1,1.6);canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);seed=7319;trees=[];plants=[];const count=Math.min(440,Math.round(w*h/2100));for(let i=0;i<count;i++){const side=rand()<.5?-1:1,z=8+rand()*190;trees.push({x:side*(3.7+rand()*21),z,h:5+rand()*13,r:.5+rand()*1.7,tone:rand(),lean:(rand()-.5)*.8,seed:rand()})}for(let i=0;i<330;i++)plants.push({x:(rand()-.5)*35,z:2+rand()*110,size:.08+rand()*.28,tone:rand()})}
    function pathX(z){return Math.sin(z*.027)*2.5+Math.sin(z*.008)*4.2}
    function project(x,z,y=0){const dz=z-camera.z;if(dz<1)return null;const focal=h*.88,scale=focal/dz,relativeX=x-camera.x-pathX(camera.z);const side=relativeX*Math.cos(camera.yaw)-dz*Math.sin(camera.yaw);const depth=dz*Math.cos(camera.yaw)+relativeX*Math.sin(camera.yaw);if(depth<1)return null;const s=focal/depth;return{x:w*.5+side*s,y:h*.49+(1.45-y)*s,scale:s,depth}}
    function poly(points,fill){ctx.fillStyle=fill;ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath();ctx.fill()}
    function drawSky(t){const g=ctx.createLinearGradient(0,0,0,h*.72);g.addColorStop(0,'#172a27');g.addColorStop(.38,'#52695b');g.addColorStop(.7,'#a9a98b');g.addColorStop(1,'#43523a');ctx.fillStyle=g;ctx.fillRect(0,0,w,h);const glow=ctx.createRadialGradient(w*.52,h*.39,1,w*.52,h*.42,h*.46);glow.addColorStop(0,'rgba(239,225,177,.29)');glow.addColorStop(.35,'rgba(205,211,172,.11)');glow.addColorStop(1,'rgba(205,211,172,0)');ctx.fillStyle=glow;ctx.fillRect(0,0,w,h*.9);
      // Distant overlapping ridge lines provide a deep, layered canopy rather than a flat backdrop.
      for(let layer=0;layer<4;layer++){const y=h*(.32+layer*.047);ctx.beginPath();ctx.moveTo(0,h);for(let x=0;x<=w+10;x+=12){const yy=y+Math.sin(x*.009+layer*2.7+t*.00012)*h*.025+Math.sin(x*.027+layer)*h*.009;ctx.lineTo(x,yy)}ctx.lineTo(w,h);ctx.closePath();ctx.fillStyle=['rgba(31,53,42,.35)','rgba(25,45,34,.5)','rgba(22,39,29,.68)','rgba(18,33,25,.82)'][layer];ctx.fill()}}
    function drawRoad(){const horizon=h*.47;const left=[],right=[],shoulderL=[],shoulderR=[];for(let i=0;i<=100;i++){const z=camera.z+2.2+i*1.65;const center=pathX(z)-camera.x;const width=.7+z*.075;const a=project(center-width*1.28,z),b=project(center+width*1.28,z),c=project(center-width,z),d=project(center+width,z);if(a&&b&&c&&d){shoulderL.push(a);shoulderR.push(b);left.push(c);right.push(d)}}if(left.length<2)return;poly([...shoulderL,...shoulderR.slice().reverse()],'#313a2b');poly([...left,...right.slice().reverse()],'#625b43');poly([...left,...right.slice().reverse()],'#625b43');
      // Irregular, distance-scaled stones and leaf litter are drawn directly into the trail.
      for(let i=0;i<145;i++){const z=camera.z+2.8+((i*17.37+camera.z*1.3)%145);const u=Math.sin(i*127.1)*.84;const x=pathX(z)+u*(.65+z*.062);const p=project(x,z,.02);if(!p)continue;const size=Math.min(16,Math.max(.5,p.scale*(.04+Math.abs(Math.sin(i*8.2))*.075)));ctx.fillStyle=['rgba(36,39,29,.34)','rgba(174,151,108,.27)','rgba(25,34,25,.4)','rgba(206,184,133,.18)'][i%4];ctx.beginPath();ctx.ellipse(p.x,p.y,size*1.8,size*.65,i*.7,0,TAU);ctx.fill()}
      // Softly broken center highlights suggest a damp, uneven footpath.
      const shine=ctx.createLinearGradient(0,horizon,0,h);shine.addColorStop(0,'rgba(197,181,137,0)');shine.addColorStop(.65,'rgba(201,184,143,.10)');shine.addColorStop(1,'rgba(208,192,152,.04)');poly([...left,...right.slice().reverse()],shine);
    }
    function drawTree(tree,t){const p=project(tree.x,tree.z);if(!p||p.x<-w*.2||p.x>w*1.2)return;const s=p.scale,height=tree.h*s;if(height<1)return;const base=p.y,top=base-height,thick=Math.max(.6,tree.r*s*.24),lean=tree.lean*height;const fog=Math.max(0,Math.min(.78,(tree.z-camera.z-32)/150));const colors=['#17271e','#1c3023','#243b29','#31462d','#3a4b30'];let bark=colors[Math.floor(tree.tone*colors.length)];
      const trunk=ctx.createLinearGradient(p.x-thick,0,p.x+thick,0);trunk.addColorStop(0,'#101a14');trunk.addColorStop(.38,tree.tone>.5?'#4a4934':'#393c2c');trunk.addColorStop(1,'#111a14');ctx.fillStyle=trunk;ctx.beginPath();ctx.moveTo(p.x-thick,base+2);ctx.lineTo(p.x+thick,base+2);ctx.lineTo(p.x+lean+thick*.3,top+height*.18);ctx.lineTo(p.x+lean-thick*.2,top+height*.18);ctx.closePath();ctx.fill();
      const crownY=top+height*.18;const crownX=p.x+lean;const crownW=Math.max(2,tree.r*s*1.65);const clusters=7;for(let i=0;i<clusters;i++){const q=(i*2.399+tree.seed*10),ring=(.25+(i%3)*.18),cx=crownX+Math.cos(q)*crownW*ring,cy=crownY+Math.sin(q)*height*.09-(i%3)*height*.025,rx=crownW*(.52+(i%4)*.12),ry=height*(.085+(i%3)*.025);const grad=ctx.createRadialGradient(cx-rx*.2,cy-ry*.25,1,cx,cy,rx*1.15);grad.addColorStop(0,tree.tone>.65?'#63704a':'#43563a');grad.addColorStop(.45,bark);grad.addColorStop(1,'#14231a');ctx.fillStyle=grad;ctx.beginPath();ctx.ellipse(cx,cy,rx,ry,q*.04,0,TAU);ctx.fill()}
      // Fine branch silhouettes make near trunks read as individual trees.
      if(s>5){ctx.strokeStyle='rgba(15,24,17,.75)';ctx.lineWidth=Math.max(.7,thick*.38);ctx.beginPath();ctx.moveTo(p.x+lean*.25,top+height*.48);ctx.lineTo(p.x+lean*.25-height*.1,top+height*.36);ctx.lineTo(p.x+lean*.25-height*.13,top+height*.31);ctx.moveTo(p.x+lean*.25,top+height*.43);ctx.lineTo(p.x+lean*.25+height*.13,top+height*.34);ctx.stroke()}
      if(fog>.01){ctx.fillStyle=`rgba(177,190,163,${fog*.36})`;ctx.beginPath();ctx.ellipse(p.x,top+height*.31,crownW*1.2,height*.16,0,0,TAU);ctx.fill()}}
    function drawUnderstory(t){for(const leaf of plants){const p=project(leaf.x+pathX(leaf.z),leaf.z);if(!p||p.x<0||p.x>w||p.y<h*.46)continue;const size=Math.max(.45,leaf.size*p.scale);ctx.fillStyle=['rgba(34,54,34,.8)','rgba(60,73,39,.7)','rgba(91,91,52,.65)','rgba(28,48,36,.78)'][Math.floor(leaf.tone*4)];ctx.beginPath();ctx.ellipse(p.x,p.y,size*1.6,size*.42,leaf.tone*2,0,TAU);ctx.fill()}}
    function drawFog(t){for(let i=0;i<5;i++){const x=w*(.12+i*.19)+Math.sin(t*.00018+i*2)*w*.035,y=h*(.48+i*.025);const g=ctx.createRadialGradient(x,y,0,x,y,w*.2);g.addColorStop(0,`rgba(204,214,190,${.055+Math.sin(t*.0003+i)*.018})`);g.addColorStop(1,'rgba(204,214,190,0)');ctx.fillStyle=g;ctx.fillRect(x-w*.2,y-h*.13,w*.4,h*.3)}}
    function draw(t){frame=t;ctx.setTransform(dpr,0,0,dpr,0,0);camera.yaw+=(camera.targetYaw-camera.yaw)*.045;drawSky(t);drawRoad();const sorted=trees.slice().sort((a,b)=>b.z-a.z);for(const tree of sorted)drawTree(tree,t);drawUnderstory(t);drawFog(t);
      // Subtle shafts of filtered canopy light.
      ctx.save();ctx.globalCompositeOperation='screen';for(let i=0;i<3;i++){const x=w*(.43+i*.09)+Math.sin(t*.0002+i)*w*.02;const g=ctx.createLinearGradient(x,0,x-50,h*.75);g.addColorStop(0,'rgba(226,220,174,.035)');g.addColorStop(1,'rgba(226,220,174,0)');ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(x-15,0);ctx.lineTo(x+20,0);ctx.lineTo(x-70,h*.76);ctx.lineTo(x-128,h*.76);ctx.fill()}ctx.restore();requestAnimationFrame(draw)}
    function move(){walking=true;document.body.classList.add('walking');camera.z+=7.5;camera.x+=(Math.random()-.5)*.5;bar.style.width=`${((Math.floor(camera.z/7.5)%6+1)/6)*100}%`;locationLabel.textContent=['宁静 · 林间小径','薄雾 · 深林深处','微光 · 林间转弯','静谧 · 苔石小路','晨露 · 林间幽径','远方 · 无尽林海'][Math.floor(camera.z/7.5)%6];document.body.classList.add('show-label');clearTimeout(move.timer);move.timer=setTimeout(()=>document.body.classList.remove('show-label'),1250)}
    start.addEventListener('click',move);scene.addEventListener('click',e=>{if(drag?.moved)return;move();camera.targetYaw+=(e.clientX/w-.5)*.11});scene.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,lastX:e.clientX,moved:false};scene.setPointerCapture?.(e.pointerId)});scene.addEventListener('pointermove',e=>{if(!drag)return;if(Math.abs(e.clientX-drag.x)>5||Math.abs(e.clientY-drag.y)>5)drag.moved=true;if(drag.moved){camera.targetYaw=Math.max(-.48,Math.min(.48,camera.targetYaw-(e.clientX-drag.lastX)/w*.9))}drag.lastX=e.clientX});scene.addEventListener('pointerup',()=>{if(drag?.moved){setTimeout(()=>drag=null,0)}else drag=null});scene.addEventListener('pointercancel',()=>drag=null);
    window.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','w','a','s','d',' '].includes(e.key)){e.preventDefault();if(e.key==='ArrowLeft'||e.key==='a')camera.targetYaw=Math.max(-.48,camera.targetYaw-.08);else if(e.key==='ArrowRight'||e.key==='d')camera.targetYaw=Math.min(.48,camera.targetYaw+.08);else move()}});
    let audio=null;function toggleSound(){if(!audio){audio=new(window.AudioContext||window.webkitAudioContext)();const master=audio.createGain();master.gain.value=.035;master.connect(audio.destination);[130,196,293.66,392].forEach((freq,i)=>{const osc=audio.createOscillator(),gain=audio.createGain();osc.type=i===0?'triangle':'sine';osc.frequency.value=freq;gain.gain.value=i===0?.12:.025;osc.connect(gain);gain.connect(master);osc.start()});const noiseBuffer=audio.createBuffer(1,audio.sampleRate*2,audio.sampleRate),data=noiseBuffer.getChannelData(0);for(let i=0;i<data.length;i++)data[i]=(Math.random()*2-1)*.12;const noise=audio.createBufferSource(),filter=audio.createBiquadFilter(),ng=audio.createGain();noise.buffer=noiseBuffer;noise.loop=true;filter.type='lowpass';filter.frequency.value=700;ng.gain.value=.22;noise.connect(filter);filter.connect(ng);ng.connect(master);noise.start()}const enabled=sound.getAttribute('aria-pressed')!=='true';sound.setAttribute('aria-pressed',String(enabled));soundText.textContent=enabled?'关闭声音':'开启声音';if(enabled)audio.resume();else audio.suspend()}
    sound.addEventListener('click',toggleSound);window.addEventListener('resize',resize);resize();requestAnimationFrame(draw);
  })();
  </script>
</body>
</html>
