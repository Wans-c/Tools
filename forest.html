<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101710">
  <meta name="description" content="走进静谧森林，沿着由 JavaScript 实时绘制的蜿蜒小路自由探索。">
  <title>林间 · 无尽漫游</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Noto+Serif+SC:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root{color-scheme:dark;--cream:#f2efe5;--serif:'Noto Serif SC',Georgia,serif;--sans:'DM Sans',sans-serif}
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#101a14;color:var(--cream)}
    body{font-family:var(--sans);-webkit-font-smoothing:antialiased;user-select:none}
    .scene{position:fixed;inset:0;overflow:hidden;cursor:crosshair;touch-action:none;background:#14221a}
    canvas{display:block;width:100%;height:100%}
    .shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(8,15,11,.38),transparent 25%,transparent 58%,rgba(7,13,9,.48)),radial-gradient(ellipse at 50% 43%,transparent 34%,rgba(4,9,6,.2) 78%,rgba(4,8,6,.55) 130%)}
    header{position:fixed;z-index:2;top:0;left:0;right:0;padding:clamp(24px,4vw,48px) clamp(24px,5vw,72px);display:flex;align-items:center;justify-content:space-between;pointer-events:none}
    .brand{font-size:11px;letter-spacing:.23em;text-transform:uppercase;color:rgba(242,239,229,.86);text-shadow:0 2px 12px #111}
    .sound{pointer-events:auto;color:inherit;display:flex;align-items:center;gap:10px;border:1px solid rgba(255,255,255,.3);background:rgba(16,23,17,.24);backdrop-filter:blur(12px);border-radius:100px;padding:10px 15px;font:500 11px var(--sans);letter-spacing:.1em;cursor:pointer;transition:background .2s,border-color .2s}
    .sound:hover,.sound:focus-visible{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.6);outline:none}
    .sound-icon{width:14px;height:14px;display:flex;align-items:center;justify-content:center;gap:2px}.sound-icon i{display:block;width:2px;height:5px;border-radius:2px;background:currentColor;transition:height .2s}
    .sound[aria-pressed="true"] .sound-icon i:nth-child(1){height:8px}.sound[aria-pressed="true"] .sound-icon i:nth-child(2){height:13px}.sound[aria-pressed="true"] .sound-icon i:nth-child(3){height:6px}.sound[aria-pressed="true"] .sound-icon i:nth-child(4){height:10px}
    .bottom{position:fixed;z-index:2;left:0;right:0;bottom:0;padding:26px clamp(24px,5vw,72px) max(26px,env(safe-area-inset-bottom));display:flex;align-items:flex-end;justify-content:space-between;color:rgba(242,239,229,.78);font-size:10px;letter-spacing:.16em;text-transform:uppercase;pointer-events:none;text-shadow:0 1px 9px #111}
    .location{display:flex;align-items:center;gap:10px}.location:before{content:"";height:1px;width:28px;background:rgba(242,239,229,.7)}
    .hint{display:flex;align-items:center;gap:9px;text-align:right}.mouse{width:15px;height:22px;border:1px solid rgba(242,239,229,.72);border-radius:9px;position:relative}.mouse:after{content:"";position:absolute;width:2px;height:4px;left:5px;top:4px;border-radius:2px;background:currentColor;animation:scroll 1.6s ease infinite}
    @keyframes scroll{0%{transform:translateY(0);opacity:1}100%{transform:translateY(6px);opacity:0}}
    .walk-label{position:fixed;z-index:2;top:50%;left:50%;transform:translate(-50%,-50%);font:400 12px var(--serif);letter-spacing:.28em;color:rgba(255,255,255,.86);opacity:0;transition:opacity .4s;pointer-events:none;text-shadow:0 2px 12px #000}.show-label .walk-label{opacity:1}
    @media(max-width:600px){header{padding-top:max(22px,env(safe-area-inset-top))}.brand{font-size:9px}.sound{padding:9px 12px;font-size:9px}.bottom{font-size:8px;padding-bottom:max(22px,env(safe-area-inset-bottom))}.hint{max-width:145px;line-height:1.8}}
    @media(prefers-reduced-motion:reduce){.mouse:after{animation:none}}
  </style>
</head>
<body>
  <div class="scene" id="scene" aria-label="由 JavaScript 绘制的可交互森林小路场景"><canvas id="forest" aria-label="实时生成的森林、雾气与蜿蜒小路"></canvas><div class="shade"></div></div>
  <header><div class="brand">A QUIET WALK · 林间漫游</div><button class="sound" id="sound" type="button" aria-pressed="false" aria-label="开启森林环境音"><span class="sound-icon" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span id="soundText">开启声音</span></button></header>
  <div class="walk-label" id="walkLabel">沿着小路，继续向前</div>
  <footer class="bottom"><div class="location" id="location">宁静 · 林间小径</div><div class="hint"><span class="mouse" aria-hidden="true"></span><span>点击前行 · 拖动视角<br>或使用方向键漫步</span></div></footer>
  <script>
  (()=>{
    const canvas=document.getElementById('forest'),ctx=canvas.getContext('2d',{alpha:false}),scene=document.getElementById('scene');
    const sound=document.getElementById('sound'),soundText=document.getElementById('soundText'),locationLabel=document.getElementById('location');
    const TAU=Math.PI*2;let w=0,h=0,dpr=1,seed=7319,trees=[],plants=[],camera={z:0,x:0,yaw:0,targetYaw:0},drag=null,audio=null;
    function rand(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}
    function resize(){const r=canvas.getBoundingClientRect();w=r.width;h=r.height;dpr=Math.min(devicePixelRatio||1,1.35);canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);seed=7319;trees=[];plants=[];const count=Math.min(210,Math.max(120,Math.round(w*h/3800)));for(let i=0;i<count;i++){const side=rand()<.5?-1:1;trees.push({side,offset:3.1+rand()*22,z:5+rand()*180,height:7+rand()*18,r:.65+rand()*1.7,tone:rand(),lean:(rand()-.5)*.24,seed:rand(),kind:rand()})}for(let i=0;i<200;i++)plants.push({x:(rand()-.5)*31,z:2+rand()*115,size:.08+rand()*.28,tone:rand()})}
    // Broad, slow bends with a smaller secondary sway make the trail visibly meander into the distance.
    function curve(z){return Math.sin(z*.018)*9+Math.sin(z*.043+1.1)*1.8+Math.sin(z*.007)*3.2}
    function project(x,depth,y=0){if(depth<.8)return null;const focal=h*.9,relativeX=x-camera.x,side=relativeX*Math.cos(camera.yaw)-depth*Math.sin(camera.yaw),distance=depth*Math.cos(camera.yaw)+relativeX*Math.sin(camera.yaw);if(distance<.8)return null;const scale=focal/distance;return{x:w*.5+side*scale,y:h*.49+(1.45-y)*scale,scale,depth:distance}}
    function polygon(points,color){ctx.fillStyle=color;ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath();ctx.fill()}
    function drawSky(t){const g=ctx.createLinearGradient(0,0,0,h*.78);g.addColorStop(0,'#14231f');g.addColorStop(.38,'#435c4b');g.addColorStop(.72,'#a2a488');g.addColorStop(1,'#394a37');ctx.fillStyle=g;ctx.fillRect(0,0,w,h);const glow=ctx.createRadialGradient(w*.52,h*.39,1,w*.52,h*.42,h*.46);glow.addColorStop(0,'rgba(239,225,177,.29)');glow.addColorStop(.38,'rgba(205,211,172,.11)');glow.addColorStop(1,'rgba(205,211,172,0)');ctx.fillStyle=glow;ctx.fillRect(0,0,w,h*.9);for(let layer=0;layer<4;layer++){const y=h*(.31+layer*.05);ctx.beginPath();ctx.moveTo(0,h);for(let x=0;x<=w+10;x+=12)ctx.lineTo(x,y+Math.sin(x*.009+layer*2.7+t*.00012)*h*.025+Math.sin(x*.027+layer)*h*.009);ctx.lineTo(w,h);ctx.closePath();ctx.fillStyle=['rgba(31,53,42,.35)','rgba(25,45,34,.5)','rgba(22,39,29,.68)','rgba(18,33,25,.82)'][layer];ctx.fill()}}
    function drawRoad(){const left=[],right=[],outerL=[],outerR=[];for(let i=0;i<=120;i++){const d=1.5+i*1.35,center=curve(camera.z+d)-curve(camera.z)-camera.x,width=2.15;const a=project(center-width,d),b=project(center+width,d),oa=project(center-width*1.28,d),ob=project(center+width*1.28,d);if(a&&b&&oa&&ob){left.push(a);right.push(b);outerL.push(oa);outerR.push(ob)}}if(left.length<2)return;polygon([...outerL,...outerR.slice().reverse()],'#30392b');polygon([...left,...right.slice().reverse()],'#625a42');
      // Uneven earth, leaf litter and stones are rendered as geometry, not an image texture.
      for(let i=0;i<190;i++){const d=2+((i*13.73+camera.z*1.6)%155),u=Math.sin(i*127.1)*.92,center=curve(camera.z+d)-curve(camera.z)-camera.x,p=project(center+u*(1.6+d*.012),d,.015);if(!p)continue;const size=Math.min(16,Math.max(.45,p.scale*(.025+Math.abs(Math.sin(i*8.2))*.075)));ctx.fillStyle=['rgba(36,39,29,.45)','rgba(174,151,108,.3)','rgba(25,34,25,.44)','rgba(206,184,133,.18)'][i%4];ctx.beginPath();ctx.ellipse(p.x,p.y,size*1.8,size*.6,i*.7,0,TAU);ctx.fill()}
      // Fine irregular ruts follow the full path curve, clarifying its serpentine silhouette.
      for(const side of [-1,1]){ctx.beginPath();let started=false;for(let i=0;i<=110;i++){const d=2+i*1.45,center=curve(camera.z+d)-curve(camera.z)-camera.x,p=project(center+side*(1.48+Math.sin(d*.24)*.08),d,.018);if(!p)continue;if(!started){ctx.moveTo(p.x,p.y);started=true}else ctx.lineTo(p.x,p.y)}ctx.strokeStyle='rgba(25,30,23,.32)';ctx.lineWidth=1.4;ctx.stroke()}}
    function drawTree(tree,depth){const center=curve(camera.z+depth)-curve(camera.z)-camera.x,worldX=center+tree.side*tree.offset,p=project(worldX,depth);if(!p||p.x<-w*.24||p.x>w*1.24)return;const s=p.scale,height=tree.height*s;if(height<1)return;const base=p.y,top=base-height,thick=Math.max(.65,tree.r*s*.24),lean=tree.lean*height,branchY=top+height*.18;
      // A tapered, faceted trunk with visible roots and several ascending limbs.
      const bark=ctx.createLinearGradient(p.x-thick*1.8,0,p.x+thick*1.8,0);bark.addColorStop(0,'#111812');bark.addColorStop(.22,'#393c2c');bark.addColorStop(.52,tree.tone>.53?'#655b3d':'#4a4935');bark.addColorStop(.78,'#292f23');bark.addColorStop(1,'#101710');ctx.fillStyle=bark;ctx.beginPath();ctx.moveTo(p.x-thick*1.25,base+1);ctx.lineTo(p.x+thick*1.35,base+1);ctx.lineTo(p.x+lean+thick*.42,branchY);ctx.lineTo(p.x+lean-thick*.28,branchY);ctx.closePath();ctx.fill();if(s>3){ctx.strokeStyle='rgba(29,31,22,.86)';ctx.lineWidth=Math.max(.65,thick*.55);ctx.beginPath();ctx.moveTo(p.x,base);ctx.quadraticCurveTo(p.x-thick*1.4,base-thick,p.x-thick*2.2,base+1);ctx.moveTo(p.x,base);ctx.quadraticCurveTo(p.x+thick*1.4,base-thick,p.x+thick*2.4,base+1);ctx.stroke()}
      // Branches are drawn before foliage; each forks naturally toward the canopy edge.
      const crownW=Math.max(2,tree.r*s*2.4);ctx.strokeStyle=tree.tone>.5?'#313b29':'#202f23';ctx.lineCap='round';for(let b=0;b<5;b++){const f=.34+b*.105,dir=b%2?1:-1;ctx.lineWidth=Math.max(.5,thick*(.48-b*.065));ctx.beginPath();ctx.moveTo(p.x+lean*f,base-height*f);ctx.quadraticCurveTo(p.x+dir*crownW*.36+lean*f,base-height*(f+.07),p.x+dir*crownW*.82+lean*.85,top+height*(.18+(b%3)*.06));ctx.stroke()}
      // Overlapping irregular foliage clusters with shaded cores and scattered sunlit edges.
      for(let i=0;i<15;i++){const a=i*2.399+tree.seed*12,rad=.12+(i%5)*.115,cx=p.x+lean+Math.cos(a)*crownW*rad,cy=top+height*(.2+((i*7)%11)/38)+Math.sin(a)*height*.09,rx=crownW*(.24+(i%4)*.09),ry=height*(.033+(i%3)*.012);const grad=ctx.createRadialGradient(cx-rx*.24,cy-ry*.25,Math.max(.2,rx*.04),cx,cy,rx*1.2);grad.addColorStop(0,tree.tone>.62?'#71805a':'#5c704d');grad.addColorStop(.28,tree.kind>.56?'#465e3c':'#3b5639');grad.addColorStop(.72,tree.tone>.42?'#2c432f':'#263a2c');grad.addColorStop(1,'#17271e');ctx.fillStyle=grad;ctx.beginPath();ctx.ellipse(cx,cy,rx,ry,a*.08,0,TAU);ctx.fill();if(s>4&&i%2===0){ctx.strokeStyle='rgba(149,157,101,.18)';ctx.lineWidth=Math.max(.35,rx*.025);ctx.beginPath();ctx.moveTo(cx-rx*.55,cy-ry*.05);ctx.quadraticCurveTo(cx,cy-ry*.5,cx+rx*.48,cy+ry*.03);ctx.stroke()}}
      // Distance haze softens far trees without using a photographic asset.
      const fog=Math.max(0,Math.min(.5,(depth-55)/190));if(fog){ctx.fillStyle=`rgba(184,197,173,${fog})`;ctx.beginPath();ctx.ellipse(p.x,top+height*.36,crownW*1.3,height*.13,0,0,TAU);ctx.fill()}}
    function drawPlants(){for(const leaf of plants){let depth=((leaf.z-camera.z)%115+115)%115;if(depth<2)depth+=115;const sideX=(curve(camera.z+depth)-curve(camera.z)-camera.x)+leaf.x,p=project(sideX,depth);if(!p||p.x<0||p.x>w||p.y<h*.46)continue;const size=Math.max(.45,leaf.size*p.scale);ctx.fillStyle=['rgba(34,54,34,.82)','rgba(60,73,39,.72)','rgba(91,91,52,.67)','rgba(28,48,36,.8)'][Math.floor(leaf.tone*4)];ctx.beginPath();ctx.ellipse(p.x,p.y,size*1.7,size*.45,leaf.tone*2,0,TAU);ctx.fill()}}
    function drawMist(t){for(let i=0;i<5;i++){const x=w*(.12+i*.19)+Math.sin(t*.00018+i*2)*w*.035,y=h*(.48+i*.025),g=ctx.createRadialGradient(x,y,0,x,y,w*.2);g.addColorStop(0,`rgba(204,214,190,${.055+Math.sin(t*.0003+i)*.018})`);g.addColorStop(1,'rgba(204,214,190,0)');ctx.fillStyle=g;ctx.fillRect(x-w*.2,y-h*.13,w*.4,h*.3)}}
    function render(t){camera.yaw+=(camera.targetYaw-camera.yaw)*.045;drawSky(t);drawRoad();const visible=trees.map(tree=>({tree,depth:((tree.z-camera.z)%180+180)%180||180})).sort((a,b)=>b.depth-a.depth);for(const item of visible)drawTree(item.tree,item.depth);drawPlants();drawMist(t);ctx.save();ctx.globalCompositeOperation='screen';for(let i=0;i<3;i++){const x=w*(.43+i*.09)+Math.sin(t*.0002+i)*w*.02,g=ctx.createLinearGradient(x,0,x-50,h*.75);g.addColorStop(0,'rgba(226,220,174,.035)');g.addColorStop(1,'rgba(226,220,174,0)');ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(x-15,0);ctx.lineTo(x+20,0);ctx.lineTo(x-70,h*.76);ctx.lineTo(x-128,h*.76);ctx.fill()}ctx.restore();requestAnimationFrame(render)}
    function move(){camera.z+=7.5;locationLabel.textContent=['宁静 · 林间小径','薄雾 · 深林深处','微光 · 林间转弯','静谧 · 苔石小路','晨露 · 林间幽径','远方 · 无尽林海'][Math.floor(camera.z/7.5)%6];document.body.classList.add('show-label');clearTimeout(move.timer);move.timer=setTimeout(()=>document.body.classList.remove('show-label'),1100)}
    scene.addEventListener('click',e=>{if(drag?.moved)return;move();camera.targetYaw=Math.max(-.55,Math.min(.55,camera.targetYaw+(e.clientX/w-.5)*.1))});scene.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,lastX:e.clientX,moved:false};scene.setPointerCapture?.(e.pointerId)});scene.addEventListener('pointermove',e=>{if(!drag)return;if(Math.abs(e.clientX-drag.x)>5||Math.abs(e.clientY-drag.y)>5)drag.moved=true;if(drag.moved)camera.targetYaw=Math.max(-.65,Math.min(.65,camera.targetYaw-(e.clientX-drag.lastX)/w*.9));drag.lastX=e.clientX});scene.addEventListener('pointerup',()=>{if(drag?.moved)setTimeout(()=>drag=null,0);else drag=null});scene.addEventListener('pointercancel',()=>drag=null);
    window.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','w','a','s','d',' '].includes(e.key)){e.preventDefault();if(e.key==='ArrowLeft'||e.key==='a')camera.targetYaw=Math.max(-.65,camera.targetYaw-.08);else if(e.key==='ArrowRight'||e.key==='d')camera.targetYaw=Math.min(.65,camera.targetYaw+.08);else move()}});
    function toggleSound(){if(!audio){const AudioContext=window.AudioContext||window.webkitAudioContext;if(!AudioContext)return;audio=new AudioContext();const master=audio.createGain();master.gain.value=.035;master.connect(audio.destination);[130,196,293.66,392].forEach((freq,i)=>{const osc=audio.createOscillator(),gain=audio.createGain();osc.type=i===0?'triangle':'sine';osc.frequency.value=freq;gain.gain.value=i===0?.12:.025;osc.connect(gain);gain.connect(master);osc.start()});const buffer=audio.createBuffer(1,audio.sampleRate*2,audio.sampleRate),data=buffer.getChannelData(0);for(let i=0;i<data.length;i++)data[i]=(Math.random()*2-1)*.12;const noise=audio.createBufferSource(),filter=audio.createBiquadFilter(),gain=audio.createGain();noise.buffer=buffer;noise.loop=true;filter.type='lowpass';filter.frequency.value=700;gain.gain.value=.22;noise.connect(filter);filter.connect(gain);gain.connect(master);noise.start()}const enabled=sound.getAttribute('aria-pressed')!=='true';sound.setAttribute('aria-pressed',String(enabled));soundText.textContent=enabled?'关闭声音':'开启声音';enabled?audio.resume():audio.suspend()}
    sound.addEventListener('click',toggleSound);window.addEventListener('resize',resize);resize();requestAnimationFrame(render);
  })();
  </script>
</body>
</html>
