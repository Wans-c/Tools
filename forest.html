<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101710">
  <meta name="description" content="沿着 JavaScript 实时绘制的蜿蜒林间小路漫步，感受四季森林。">
  <title>林间 · 无尽漫游</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Noto+Serif+SC:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root{color-scheme:dark;--cream:#f2efe5;--serif:'Noto Serif SC',Georgia,serif;--sans:'DM Sans',sans-serif}
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#101a14;color:var(--cream)}
    body{font-family:var(--sans);-webkit-font-smoothing:antialiased;user-select:none}
    .scene{position:fixed;inset:0;overflow:hidden;cursor:crosshair;touch-action:none;background:#14221a}
    canvas{display:block;width:100%;height:100%}
    .shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(8,15,11,.38),transparent 25%,transparent 58%,rgba(7,13,9,.48)),radial-gradient(ellipse at 50% 43%,transparent 34%,rgba(4,9,6,.2) 78%,rgba(4,8,6,.55) 130%)}
    header{position:fixed;z-index:2;top:0;left:0;right:0;padding:clamp(20px,3vw,40px) clamp(20px,4vw,60px);display:flex;align-items:center;justify-content:space-between;gap:14px;pointer-events:none}
    .brand{font-size:11px;letter-spacing:.23em;text-transform:uppercase;color:rgba(242,239,229,.86);text-shadow:0 2px 12px #111;white-space:nowrap}
    .controls{pointer-events:auto;display:flex;align-items:center;gap:8px}
    .season-switch{display:flex;align-items:center;gap:3px;padding:4px;border:1px solid rgba(255,255,255,.25);border-radius:100px;background:rgba(16,23,17,.32);backdrop-filter:blur(12px)}
    .season{border:0;background:transparent;color:rgba(255,255,255,.78);border-radius:100px;padding:8px 11px;font:500 11px var(--sans);letter-spacing:.08em;cursor:pointer;transition:background .2s,color .2s}
    .season:hover,.season:focus-visible{color:#fff;background:rgba(255,255,255,.12);outline:none}.season[aria-pressed="true"]{background:rgba(242,239,229,.9);color:#1a211a}
    .sound{color:inherit;display:flex;align-items:center;gap:10px;border:1px solid rgba(255,255,255,.3);background:rgba(16,23,17,.32);backdrop-filter:blur(12px);border-radius:100px;padding:10px 15px;font:500 11px var(--sans);letter-spacing:.1em;cursor:pointer;transition:background .2s,border-color .2s}
    .sound:hover,.sound:focus-visible{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.6);outline:none}
    .sound-icon{width:14px;height:14px;display:flex;align-items:center;justify-content:center;gap:2px}.sound-icon i{display:block;width:2px;height:5px;border-radius:2px;background:currentColor;transition:height .2s}
    .sound[aria-pressed="true"] .sound-icon i:nth-child(1){height:8px}.sound[aria-pressed="true"] .sound-icon i:nth-child(2){height:13px}.sound[aria-pressed="true"] .sound-icon i:nth-child(3){height:6px}.sound[aria-pressed="true"] .sound-icon i:nth-child(4){height:10px}
    .bottom{position:fixed;z-index:2;left:0;right:0;bottom:0;padding:26px clamp(24px,5vw,72px) max(26px,env(safe-area-inset-bottom));display:flex;align-items:flex-end;justify-content:space-between;color:rgba(242,239,229,.78);font-size:10px;letter-spacing:.16em;text-transform:uppercase;pointer-events:none;text-shadow:0 1px 9px #111}
    .location{display:flex;align-items:center;gap:10px}.location:before{content:"";height:1px;width:28px;background:rgba(242,239,229,.7)}
    .hint{display:flex;align-items:center;gap:9px;text-align:right}.mouse{width:15px;height:22px;border:1px solid rgba(242,239,229,.72);border-radius:9px;position:relative}.mouse:after{content:"";position:absolute;width:2px;height:4px;left:5px;top:4px;border-radius:2px;background:currentColor;animation:scroll 1.6s ease infinite}
    @keyframes scroll{0%{transform:translateY(0);opacity:1}100%{transform:translateY(6px);opacity:0}}
    .walk-label{position:fixed;z-index:2;top:50%;left:50%;transform:translate(-50%,-50%);font:400 12px var(--serif);letter-spacing:.28em;color:rgba(255,255,255,.86);opacity:0;transition:opacity .4s;pointer-events:none;text-shadow:0 2px 12px #000}.show-label .walk-label{opacity:1}
    @media(max-width:600px){header{padding-top:max(18px,env(safe-area-inset-top));align-items:flex-start}.brand{font-size:8px;letter-spacing:.13em;padding-top:10px}.controls{gap:5px}.season{padding:7px 8px;font-size:10px}.sound{padding:9px 10px;font-size:0}.sound-icon{width:16px}.bottom{font-size:8px;padding-bottom:max(22px,env(safe-area-inset-bottom))}.hint{max-width:145px;line-height:1.8}}
    @media(prefers-reduced-motion:reduce){.mouse:after{animation:none}*{scroll-behavior:auto!important}}
  </style>
</head>
<body>
  <div class="scene" id="scene" aria-label="由 JavaScript 绘制的可交互森林小路场景"><canvas id="forest" aria-label="实时生成的森林、雾气与蜿蜒小路"></canvas><div class="shade"></div></div>
  <header><div class="brand">A QUIET WALK · 林间漫游</div><div class="controls"><div class="season-switch" role="group" aria-label="切换森林季节"><button class="season" type="button" data-season="spring" aria-pressed="false">春</button><button class="season" type="button" data-season="summer" aria-pressed="true">夏</button><button class="season" type="button" data-season="autumn" aria-pressed="false">秋</button><button class="season" type="button" data-season="winter" aria-pressed="false">冬</button></div><button class="sound" id="sound" type="button" aria-pressed="false" aria-label="开启森林环境音"><span class="sound-icon" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span id="soundText">声音</span></button></div></header>
  <div class="walk-label" id="walkLabel">沿着小路，继续向前</div>
  <footer class="bottom"><div class="location" id="location">夏日 · 林间小径</div><div class="hint"><span class="mouse" aria-hidden="true"></span><span>点击前行 · 拖动视角<br>或使用方向键漫步</span></div></footer>
  <script>
  (()=>{
    const canvas=document.getElementById('forest'),ctx=canvas.getContext('2d',{alpha:false}),scene=document.getElementById('scene');
    const sound=document.getElementById('sound'),soundText=document.getElementById('soundText'),locationLabel=document.getElementById('location');
    const TAU=Math.PI*2;
    const seasons={
      spring:{label:'春',sky:['#263b3b','#718b76','#c3bd98','#5b6749'],leaf:['#83945a','#708b4e','#526d3e','#344d31'],ground:'#665d43',edge:'#384638',atmosphere:'rgba(214,221,190,.16)',particle:'#f1d8d0',particleCount:18},
      summer:{label:'夏',sky:['#14231f','#435c4b','#a2a488','#394a37'],leaf:['#65744d','#526944','#3b5639','#263a2c'],ground:'#625a42',edge:'#30392b',atmosphere:'rgba(204,214,190,.12)',particle:'rgba(227,220,165,.65)',particleCount:10},
      autumn:{label:'秋',sky:['#29241f','#695d43','#c19b69','#493b2c'],leaf:['#bd8245','#a65e32','#805034','#573b2c'],ground:'#71583c',edge:'#483d2c',atmosphere:'rgba(227,185,132,.12)',particle:'#cf8a4c',particleCount:30},
      winter:{label:'冬',sky:['#17232b','#52616a','#b5b9b2','#48504e'],leaf:['#687269','#59675e','#3d504a','#293c39'],ground:'#77766a',edge:'#4c5753',atmosphere:'rgba(226,234,239,.22)',particle:'#f2f4ee',particleCount:42}
    };
    let season='summer',w=0,h=0,dpr=1,seed=7319,trees=[],plants=[],particles=[],camera={z:0,x:0,yaw:0,targetYaw:0},drag=null,audio=null,lastFrame=0;
    function rand(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}
    function resize(){const r=canvas.getBoundingClientRect();w=r.width;h=r.height;dpr=Math.min(devicePixelRatio||1,1.15);canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);seed=7319;trees=[];plants=[];const count=Math.min(145,Math.max(90,Math.round(w*h/5200)));for(let i=0;i<count;i++){const side=rand()<.5?-1:1;trees.push({side,offset:3.1+rand()*22,z:5+rand()*180,height:7+rand()*18,r:.65+rand()*1.7,tone:rand(),lean:(rand()-.5)*.24,seed:rand(),kind:rand(),bark:rand()})}for(let i=0;i<130;i++)plants.push({x:(rand()-.5)*31,z:2+rand()*115,size:.08+rand()*.28,tone:rand()});resetParticles()}
    function resetParticles(){const count=seasons[season].particleCount;particles=Array.from({length:count},()=>({x:rand()*Math.max(w,1),y:rand()*Math.max(h,1),speed:.18+rand()*.72,drift:(rand()-.5)*.45,size:.6+rand()*2.2,phase:rand()*TAU,alpha:.22+rand()*.58}))}
    function setSeason(next){if(!seasons[next]||next===season)return;season=next;document.querySelectorAll('.season').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.season===season)));locationLabel.textContent=seasons[season].label+' · 林间小径';resetParticles()}
    document.querySelectorAll('.season').forEach(button=>button.addEventListener('click',()=>setSeason(button.dataset.season)));
    function curve(z){return Math.sin(z*.018)*9+Math.sin(z*.043+1.1)*1.8+Math.sin(z*.007)*3.2}
    function project(x,depth,y=0){if(depth<.8)return null;const focal=h*.9,relativeX=x-camera.x,side=relativeX*Math.cos(camera.yaw)-depth*Math.sin(camera.yaw),distance=depth*Math.cos(camera.yaw)+relativeX*Math.sin(camera.yaw);if(distance<.8)return null;const scale=focal/distance;return{x:w*.5+side*scale,y:h*.49+(1.45-y)*scale,scale,depth:distance}}
    function polygon(points,color){ctx.fillStyle=color;ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath();ctx.fill()}
    function drawSky(){const s=seasons[season],g=ctx.createLinearGradient(0,0,0,h*.78);g.addColorStop(0,s.sky[0]);g.addColorStop(.38,s.sky[1]);g.addColorStop(.72,s.sky[2]);g.addColorStop(1,s.sky[3]);ctx.fillStyle=g;ctx.fillRect(0,0,w,h);const glow=ctx.createRadialGradient(w*.52,h*.39,1,w*.52,h*.42,h*.46);glow.addColorStop(0,'rgba(239,225,177,.23)');glow.addColorStop(.38,'rgba(205,211,172,.09)');glow.addColorStop(1,'rgba(205,211,172,0)');ctx.fillStyle=glow;ctx.fillRect(0,0,w,h*.9);for(let layer=0;layer<4;layer++){const y=h*(.31+layer*.05);ctx.beginPath();ctx.moveTo(0,h);for(let x=0;x<=w+10;x+=18)ctx.lineTo(x,y+Math.sin(x*.009+layer*2.7)*h*.025+Math.sin(x*.027+layer)*h*.009);ctx.lineTo(w,h);ctx.closePath();ctx.fillStyle=['rgba(31,53,42,.35)','rgba(25,45,34,.5)','rgba(22,39,29,.68)','rgba(18,33,25,.82)'][layer];ctx.fill()}}
    function drawRoad(){const s=seasons[season],left=[],right=[],outerL=[],outerR=[];for(let i=0;i<=85;i++){const d=1.5+i*1.9,center=curve(camera.z+d)-curve(camera.z)-camera.x,width=2.15,a=project(center-width,d),b=project(center+width,d),oa=project(center-width*1.28,d),ob=project(center+width*1.28,d);if(a&&b&&oa&&ob){left.push(a);right.push(b);outerL.push(oa);outerR.push(ob)}}if(left.length<2)return;polygon([...outerL,...outerR.slice().reverse()],s.edge);polygon([...left,...right.slice().reverse()],s.ground);
      // Sparse stones and leaf litter retain surface detail without hundreds of per-frame draws.
      for(let i=0;i<62;i++){const d=2+((i*29.73+camera.z*1.6)%155),u=Math.sin(i*127.1)*.92,center=curve(camera.z+d)-curve(camera.z)-camera.x,p=project(center+u*(1.6+d*.012),d,.015);if(!p)continue;const size=Math.min(13,Math.max(.5,p.scale*(.04+Math.abs(Math.sin(i*8.2))*.075)));ctx.fillStyle=season==='winter'?'rgba(226,231,225,.35)':season==='autumn'?'rgba(180,113,56,.32)':'rgba(30,34,25,.38)';ctx.beginPath();ctx.ellipse(p.x,p.y,size*1.6,size*.58,i*.7,0,TAU);ctx.fill()}
      for(const side of [-1,1]){ctx.beginPath();let started=false;for(let i=0;i<=70;i++){const d=2+i*2.25,center=curve(camera.z+d)-curve(camera.z)-camera.x,p=project(center+side*(1.48+Math.sin(d*.24)*.08),d,.018);if(!p)continue;if(!started){ctx.moveTo(p.x,p.y);started=true}else ctx.lineTo(p.x,p.y)}ctx.strokeStyle='rgba(25,30,23,.32)';ctx.lineWidth=1.2;ctx.stroke()}}
    function drawTree(tree,depth){const center=curve(camera.z+depth)-curve(camera.z)-camera.x,p=project(center+tree.side*tree.offset,depth);if(!p||p.x<-w*.24||p.x>w*1.24)return;const s=p.scale,height=tree.height*s;if(height<1)return;const base=p.y,top=base-height,thick=Math.max(.65,tree.r*s*.24),lean=tree.lean*height,branchY=top+height*.18,palette=seasons[season].leaf;
      const bark=ctx.createLinearGradient(p.x-thick*1.8,0,p.x+thick*1.8,0);bark.addColorStop(0,'#111812');bark.addColorStop(.22,tree.bark>.5?'#514832':'#393c2c');bark.addColorStop(.52,tree.bark>.55?'#695d40':'#4a4935');bark.addColorStop(.78,'#292f23');bark.addColorStop(1,'#101710');ctx.fillStyle=bark;ctx.beginPath();ctx.moveTo(p.x-thick*1.25,base+1);ctx.lineTo(p.x+thick*1.35,base+1);ctx.lineTo(p.x+lean+thick*.42,branchY);ctx.lineTo(p.x+lean-thick*.28,branchY);ctx.closePath();ctx.fill();
      // A few sturdy forks, bark grooves and roots add a more natural tree silhouette.
      if(s>2.5){ctx.strokeStyle='rgba(29,31,22,.72)';ctx.lineWidth=Math.max(.45,thick*.34);for(let k=0;k<3;k++){const x=p.x+(k-1)*thick*.47;ctx.beginPath();ctx.moveTo(x,base-height*.18);ctx.quadraticCurveTo(x+thick*.16,base-height*.48,x+lean*.42+(k-1)*height*.075,top+height*(.18+(k%2)*.08));ctx.stroke()}ctx.strokeStyle='rgba(19,24,17,.55)';ctx.lineWidth=Math.max(.45,thick*.22);ctx.beginPath();ctx.moveTo(p.x-thick*.28,base-height*.2);ctx.lineTo(p.x-thick*.14,base-height*.62);ctx.moveTo(p.x+thick*.4,base-height*.29);ctx.lineTo(p.x+thick*.25,base-height*.7);ctx.stroke()}
      const crownW=Math.max(2,tree.r*s*2.25),clusters=s>8?8:5;for(let i=0;i<clusters;i++){const a=i*2.399+tree.seed*12,cx=p.x+lean+Math.cos(a)*crownW*(.18+(i%4)*.14),cy=top+height*(.2+((i*7)%11)/38)+Math.sin(a)*height*.085,rx=crownW*(.28+(i%3)*.1),ry=height*(.035+(i%3)*.012),grad=ctx.createRadialGradient(cx-rx*.2,cy-ry*.25,Math.max(.2,rx*.04),cx,cy,rx*1.15);grad.addColorStop(0,palette[0]);grad.addColorStop(.34,palette[1]);grad.addColorStop(.75,palette[2]);grad.addColorStop(1,palette[3]);ctx.fillStyle=grad;ctx.beginPath();ctx.ellipse(cx,cy,rx,ry,a*.08,0,TAU);ctx.fill()}
      const fog=Math.max(0,Math.min(.45,(depth-58)/190));if(fog){ctx.fillStyle=`rgba(184,197,173,${fog})`;ctx.beginPath();ctx.ellipse(p.x,top+height*.36,crownW*1.25,height*.12,0,0,TAU);ctx.fill()}}
    function drawPlants(){for(const leaf of plants){let depth=((leaf.z-camera.z)%115+115)%115;if(depth<2)depth+=115;const sideX=(curve(camera.z+depth)-curve(camera.z)-camera.x)+leaf.x,p=project(sideX,depth);if(!p||p.x<0||p.x>w||p.y<h*.46)continue;const size=Math.max(.45,leaf.size*p.scale),green=season==='winter'?'rgba(107,121,113,.65)':season==='autumn'?'rgba(125,94,50,.72)':'rgba(53,72,42,.76)';ctx.fillStyle=green;ctx.beginPath();ctx.ellipse(p.x,p.y,size*1.5,size*.4,leaf.tone*2,0,TAU);ctx.fill()}}
    function drawAtmosphere(){const s=seasons[season];const g=ctx.createLinearGradient(0,h*.43,0,h*.8);g.addColorStop(0,'rgba(205,216,195,0)');g.addColorStop(.55,s.atmosphere);g.addColorStop(1,'rgba(205,216,195,0)');ctx.fillStyle=g;ctx.fillRect(0,h*.4,w,h*.42)}
    function drawParticles(dt){const s=seasons[season];ctx.save();for(const p of particles){p.y+=p.speed*dt*.04;p.x+=p.drift*dt*.025+Math.sin(p.phase+p.y*.01)*.12;if(p.y>h+8){p.y=-8;p.x=Math.random()*w}if(p.x<-8)p.x=w+8;if(p.x>w+8)p.x=-8;ctx.globalAlpha=p.alpha;ctx.fillStyle=s.particle;if(season==='winter'){ctx.beginPath();ctx.arc(p.x,p.y,p.size*.65,0,TAU);ctx.fill()}else if(season==='autumn'||season==='spring'){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.phase+p.y*.012);ctx.beginPath();ctx.ellipse(0,0,p.size*1.5,p.size*.55,0,0,TAU);ctx.fill();ctx.restore()}else{ctx.beginPath();ctx.arc(p.x,p.y,p.size*.45,0,TAU);ctx.fill()}}ctx.restore()}
    function render(now){requestAnimationFrame(render);if(now-lastFrame<45)return;const dt=Math.min(65,now-lastFrame||45);lastFrame=now;camera.yaw+=(camera.targetYaw-camera.yaw)*.08;drawSky();drawRoad();const visible=trees.map(tree=>({tree,depth:((tree.z-camera.z)%180+180)%180||180})).sort((a,b)=>b.depth-a.depth);for(const item of visible)drawTree(item.tree,item.depth);drawPlants();drawAtmosphere();drawParticles(dt)}
    function move(){camera.z+=7.5;locationLabel.textContent=seasons[season].label+' · '+['林间小径','深林深处','林间转弯','苔石小路','林间幽径','无尽林海'][Math.floor(camera.z/7.5)%6];document.body.classList.add('show-label');clearTimeout(move.timer);move.timer=setTimeout(()=>document.body.classList.remove('show-label'),1000)}
    scene.addEventListener('click',e=>{if(drag?.moved)return;move();camera.targetYaw=Math.max(-.55,Math.min(.55,camera.targetYaw+(e.clientX/w-.5)*.1))});scene.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,lastX:e.clientX,moved:false};scene.setPointerCapture?.(e.pointerId)});scene.addEventListener('pointermove',e=>{if(!drag)return;if(Math.abs(e.clientX-drag.x)>5||Math.abs(e.clientY-drag.y)>5)drag.moved=true;if(drag.moved)camera.targetYaw=Math.max(-.65,Math.min(.65,camera.targetYaw-(e.clientX-drag.lastX)/w*.9));drag.lastX=e.clientX});scene.addEventListener('pointerup',()=>{if(drag?.moved)setTimeout(()=>drag=null,0);else drag=null});scene.addEventListener('pointercancel',()=>drag=null);
    window.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','w','a','s','d',' '].includes(e.key)){e.preventDefault();if(e.key==='ArrowLeft'||e.key==='a')camera.targetYaw=Math.max(-.65,camera.targetYaw-.08);else if(e.key==='ArrowRight'||e.key==='d')camera.targetYaw=Math.min(.65,camera.targetYaw+.08);else move()}});
    function toggleSound(){if(!audio){const AudioContext=window.AudioContext||window.webkitAudioContext;if(!AudioContext)return;audio=new AudioContext();const master=audio.createGain();master.gain.value=.028;master.connect(audio.destination);[130,196,293.66,392].forEach((freq,i)=>{const osc=audio.createOscillator(),gain=audio.createGain();osc.type=i===0?'triangle':'sine';osc.frequency.value=freq;gain.gain.value=i===0?.1:.02;osc.connect(gain);gain.connect(master);osc.start()});const buffer=audio.createBuffer(1,audio.sampleRate*2,audio.sampleRate),data=buffer.getChannelData(0);for(let i=0;i<data.length;i++)data[i]=(Math.random()*2-1)*.1;const noise=audio.createBufferSource(),filter=audio.createBiquadFilter(),gain=audio.createGain();noise.buffer=buffer;noise.loop=true;filter.type='lowpass';filter.frequency.value=650;gain.gain.value=.18;noise.connect(filter);filter.connect(gain);gain.connect(master);noise.start()}const enabled=sound.getAttribute('aria-pressed')!=='true';sound.setAttribute('aria-pressed',String(enabled));soundText.textContent=enabled?'关闭':'声音';enabled?audio.resume():audio.suspend()}
    sound.addEventListener('click',toggleSound);window.addEventListener('resize',resize);resize();requestAnimationFrame(render);
  })();
  </script>
</body>
</html>
