<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#25282e">
  <title>乒乓球计分板</title>
  <style>
    * { box-sizing: border-box; }

    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      background: #25282e;
      color: #fff;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      display: grid;
      place-items: center;
      background: radial-gradient(ellipse at top, #353943 0%, #25282e 65%);
    }

    main {
      width: min(980px, 100%);
      text-align: center;
    }

    h1 {
      margin: 0 0 20px;
      font-size: clamp(28px, 5vw, 42px);
    }

    .settings {
      margin: 0 0 16px;
      color: #dce0e7;
    }

    select, .reset-button {
      padding: 10px 14px;
      border: 1px solid #555b66;
      border-radius: 10px;
      color: #fff;
      background: #343840;
      font: inherit;
    }

    select:disabled { opacity: .65; }

    .court {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .side {
      min-height: 350px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border: 2px solid transparent;
      border-radius: 22px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, .25);
      user-select: none;
      -webkit-user-select: none;
    }

    .blue { background: linear-gradient(145deg, #1976d2, #104b91); }
    .red { background: linear-gradient(145deg, #e34d59, #a92536); }
    .side.serving { border-color: #fff; }

    .side-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .player-name {
      width: 70%;
      min-width: 0;
      padding: 5px 0;
      border: 0;
      border-bottom: 1px solid rgba(255,255,255,.7);
      outline: 0;
      color: #fff;
      background: transparent;
      font: inherit;
      font-size: 22px;
      font-weight: 700;
    }

    /* 大点击区域，视觉上只显示白色圆点 */
    .server-button {
      width: 48px;
      height: 48px;
      flex: 0 0 48px;
      display: grid;
      place-items: center;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: transparent;
      cursor: pointer;
      touch-action: manipulation;
    }

    .server-button:focus-visible {
      outline: 2px solid #fff;
      outline-offset: 2px;
    }

    .server-button:disabled { cursor: default; }

    .server-dot {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255,255,255,.85);
      border-radius: 50%;
      background: transparent;
    }

    .server-button.is-serving .server-dot {
      border-color: #fff;
      background: #fff;
      box-shadow: 0 0 0 3px rgba(255,255,255,.22);
    }

    .score-area {
      flex: 1;
      min-height: 190px;
      margin: 8px -8px;
      display: grid;
      place-items: center;
      border-radius: 16px;
      cursor: pointer;
      touch-action: none;
    }

    .score {
      color: #fff;
      font-size: clamp(100px, 22vw, 170px);
      line-height: 1;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }

    .games-won { color: rgba(255,255,255,.86); }

    .match-score {
      margin-top: 16px;
      color: #e6e9ef;
      font-size: 22px;
      font-weight: 700;
    }

    .status {
      min-height: 28px;
      margin-top: 10px;
      color: #ffd166;
      font-weight: 700;
    }

    .history {
      margin-top: 14px;
      padding: 14px;
      border: 1px solid #474d57;
      border-radius: 12px;
      background: #2d3037;
    }

    .history h2 {
      margin: 0 0 10px;
      font-size: 18px;
    }

    #gameScores {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    #gameScores li {
      padding: 7px 12px;
      border-radius: 8px;
      color: #edf1f6;
      background: #3a3e47;
      font-variant-numeric: tabular-nums;
    }

    #gameScores li.current {
      border: 1px solid rgba(255,209,102,.6);
      color: #ffd166;
    }

    .reset-button {
      margin-top: 12px;
      cursor: pointer;
    }

    .reset-button:hover { background: #454a54; }

    .hint {
      margin: 12px 0 0;
      color: #b7bdc8;
      line-height: 1.7;
    }

    @media (max-width: 560px) {
      body { padding: 14px 10px; }
      .court { gap: 9px; }
      .side {
        min-height: 300px;
        padding: 14px 10px;
        border-radius: 16px;
      }
      .player-name { width: calc(100% - 44px); font-size: 18px; }
      .server-button { width: 42px; height: 42px; flex-basis: 42px; }
      .score-area { min-height: 160px; }
      .score { font-size: clamp(82px, 23vw, 130px); }
      .match-score { font-size: 20px; }
    }
  </style>
</head>
<body>
  <main>
    <h1>乒乓球计分板</h1>

    <div class="settings">
      <label for="format">比赛赛制：</label>
      <select id="format">
        <option value="2">三局两胜</option>
        <option value="3" selected>五局三胜</option>
        <option value="4">七局四胜</option>
      </select>
    </div>

    <section class="court" aria-label="比赛计分区域">
      <div class="side blue" id="sideA">
        <div class="side-top">
          <input class="player-name" id="nameA" value="蓝方" aria-label="蓝方名称" maxlength="20">
          <button class="server-button" id="serverButtonA" type="button" aria-label="选择蓝方为首发球方" title="开赛前选择首发球方">
            <span class="server-dot" aria-hidden="true"></span>
          </button>
        </div>
        <div class="score-area" data-side="A" aria-label="蓝方计分区域，单击加分，下滑撤销">
          <span class="score" id="scoreA" aria-live="polite">0</span>
        </div>
        <div class="games-won">已赢 <span id="wonA">0</span> 局</div>
      </div>

      <div class="side red" id="sideB">
        <div class="side-top">
          <input class="player-name" id="nameB" value="红方" aria-label="红方名称" maxlength="20">
          <button class="server-button" id="serverButtonB" type="button" aria-label="选择红方为首发球方" title="开赛前选择首发球方">
            <span class="server-dot" aria-hidden="true"></span>
          </button>
        </div>
        <div class="score-area" data-side="B" aria-label="红方计分区域，单击加分，下滑撤销">
          <span class="score" id="scoreB" aria-live="polite">0</span>
        </div>
        <div class="games-won">已赢 <span id="wonB">0</span> 局</div>
      </div>
    </section>

    <div class="match-score">局分：<span id="games">0 : 0</span></div>
    <div class="status" id="status" aria-live="polite"></div>

    <section class="history" aria-live="polite">
      <h2>各局比分</h2>
      <ol id="gameScores"></ol>
    </section>

    <button class="reset-button" id="resetButton" type="button">重置比赛</button>
    <p class="hint">单击计分区域得 1 分；在计分区域下滑，撤销该方最近一分。<br>开赛前点击白色圆点选择首发球方。</p>
  </main>

  <script>
    (() => {
      const pointEvents = [];
      const formatSelect = document.getElementById("format");
      let initialServer = "A";
      let pointerStart = null;
      let suppressClickUntil = 0;

      const other = side => side === "A" ? "B" : "A";

      function matchState() {
        const gamesToWin = Number(formatSelect.value);
        const state = {
          games: { A: 0, B: 0 },
          history: [],
          current: {
            points: { A: 0, B: 0 },
            firstServer: initialServer
          },
          finished: false
        };

        for (const side of pointEvents) {
          if (state.finished) break;

          const game = state.current;
          game.points[side] += 1;
          const { A, B } = game.points;
          const winner = (A >= 11 || B >= 11) && Math.abs(A - B) >= 2
            ? (A > B ? "A" : "B")
            : null;

          if (!winner) continue;

          state.history.push({ points: { A, B }, winner });
          state.games[winner] += 1;

          if (state.games[winner] >= gamesToWin) {
            state.finished = true;
            continue;
          }

          const nextFirstServer = other(game.firstServer);
          state.current = {
            points: { A: 0, B: 0 },
            firstServer: nextFirstServer
          };
        }

        return state;
      }

      function currentServer(state) {
        const game = state.current;
        const total = game.points.A + game.points.B;
        const deuce = game.points.A >= 10 && game.points.B >= 10;
        const switches = deuce ? total - 20 : Math.floor(total / 2);
        return switches % 2 === 0 ? game.firstServer : other(game.firstServer);
      }

      function render() {
        const state = matchState();
        const server = currentServer(state);
        const started = pointEvents.length > 0;
        const target = Number(formatSelect.value);

        document.getElementById("scoreA").textContent = state.current.points.A;
        document.getElementById("scoreB").textContent = state.current.points.B;
        document.getElementById("wonA").textContent = state.games.A;
        document.getElementById("wonB").textContent = state.games.B;
        document.getElementById("games").textContent = `${state.games.A} : ${state.games.B}`;
        formatSelect.disabled = started;

        const serverA = document.getElementById("serverButtonA");
        const serverB = document.getElementById("serverButtonB");
        serverA.classList.toggle("is-serving", server === "A");
        serverB.classList.toggle("is-serving", server === "B");
        serverA.disabled = started || state.finished;
        serverB.disabled = started || state.finished;
        document.getElementById("sideA").classList.toggle("serving", server === "A");
        document.getElementById("sideB").classList.toggle("serving", server === "B");

        const status = document.getElementById("status");
        if (state.finished) {
          const winner = state.games.A >= target ? "A" : "B";
          const winnerName = document.getElementById(`name${winner}`).value.trim() || (winner === "A" ? "蓝方" : "红方");
          status.textContent = `${winnerName} 赢得比赛！`;
        } else {
          const finalGame = state.games.A === target - 1 && state.games.B === target - 1;
          const reachedFive = state.current.points.A >= 5 || state.current.points.B >= 5;
          status.textContent = finalGame && reachedFive
            ? `第 ${state.history.length + 1} 局：已到 5 分，请交换场地。`
            : `第 ${state.history.length + 1} 局`;
        }

        const list = document.getElementById("gameScores");
        list.replaceChildren();
        state.history.forEach((game, index) => {
          const item = document.createElement("li");
          item.textContent = `第 ${index + 1} 局：${game.points.A} : ${game.points.B}`;
          list.appendChild(item);
        });

        if (!state.finished) {
          const current = document.createElement("li");
          current.className = "current";
          current.textContent = `第 ${state.history.length + 1} 局：${state.current.points.A} : ${state.current.points.B}（进行中）`;
          list.appendChild(current);
        }
      }

      function addPoint(side) {
        if (matchState().finished) return;
        pointEvents.push(side);
        render();
      }

      function undoPoint(side) {
        for (let i = pointEvents.length - 1; i >= 0; i -= 1) {
          if (pointEvents[i] === side) {
            pointEvents.splice(i, 1);
            render();
            return;
          }
        }
      }

      function chooseInitialServer(side) {
        if (pointEvents.length > 0 || matchState().finished) return;
        initialServer = side;
        render();
      }

      document.getElementById("serverButtonA").addEventListener("click", event => {
        event.stopPropagation();
        chooseInitialServer("A");
      });
      document.getElementById("serverButtonB").addEventListener("click", event => {
        event.stopPropagation();
        chooseInitialServer("B");
      });

      document.querySelectorAll(".score-area").forEach(area => {
        area.addEventListener("pointerdown", event => {
          pointerStart = {
            side: area.dataset.side,
            x: event.clientX,
            y: event.clientY,
            id: event.pointerId
          };
          area.setPointerCapture(event.pointerId);
        });

        area.addEventListener("pointerup", event => {
          if (!pointerStart || pointerStart.id !== event.pointerId) return;
          const dx = event.clientX - pointerStart.x;
          const dy = event.clientY - pointerStart.y;
          const side = pointerStart.side;
          const isDownSwipe = dy >= 30 && Math.abs(dy) > Math.abs(dx);
          const isTap = Math.hypot(dx, dy) < 20;
          pointerStart = null;

          if (isDownSwipe) {
            suppressClickUntil = Date.now() + 400;
            undoPoint(side);
          } else if (isTap) {
            addPoint(side);
          }
        });

        area.addEventListener("pointercancel", () => { pointerStart = null; });
        area.addEventListener("click", event => {
          if (Date.now() < suppressClickUntil) {
            event.preventDefault();
            event.stopPropagation();
            return;
          }
          // Pointer Events provide the normal tap path; this fallback supports click-only input.
          if (event.detail === 0) addPoint(area.dataset.side);
        });
      });

      document.getElementById("resetButton").addEventListener("click", () => {
        pointEvents.length = 0;
        initialServer = "A";
        pointerStart = null;
        render();
      });

      formatSelect.addEventListener("change", render);
      render();
    })();
  </script>
</body>
</html>
