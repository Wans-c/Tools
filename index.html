<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101326">
  <title>工具索引</title>
  <style>
    * { box-sizing: border-box; }
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      color: #f7f5ff;
      background: #101326;
    }
    body {
      min-height: 100vh;
      margin: 0;
      padding: 32px 20px;
      display: grid;
      place-items: center;
      background:
        radial-gradient(ellipse at 18% 15%, rgba(86, 93, 196, .35), transparent 38%),
        radial-gradient(ellipse at 88% 82%, rgba(206, 71, 142, .22), transparent 36%),
        #101326;
    }
    main { width: min(900px, 100%); }
    header { text-align: center; margin-bottom: 36px; }
    .eyebrow { color: #9c9fff; font-size: 12px; font-weight: 700; letter-spacing: .3em; }
    h1 { margin: 10px 0; font-size: clamp(34px, 7vw, 58px); letter-spacing: .08em; }
    .intro { margin: 0; color: #b7b7cf; }
    .tools { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
    .tool-card {
      min-height: 225px;
      padding: 26px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      text-decoration: none;
      color: inherit;
      border: 1px solid rgba(255,255,255,.13);
      border-radius: 22px;
      background: rgba(255,255,255,.07);
      box-shadow: 0 18px 50px rgba(0,0,0,.2);
      transition: transform .2s ease, border-color .2s ease, background .2s ease;
    }
    .tool-card:hover, .tool-card:focus-visible {
      transform: translateY(-5px);
      border-color: rgba(174,177,255,.7);
      background: rgba(255,255,255,.11);
      outline: none;
    }
    .icon { font-size: 38px; line-height: 1; }
    h2 { margin: 20px 0 8px; font-size: 23px; }
    .description { margin: 0; color: #bbb9d1; line-height: 1.7; }
    .open { margin-top: auto; padding-top: 20px; color: #b8bdff; font-weight: 700; }
    .score .open { color: #75d7ff; }
    .draw .open { color: #ff9dcc; }
    footer { margin-top: 28px; text-align: center; color: #777991; font-size: 12px; }
    @media (max-width: 600px) {
      body { padding: 28px 16px; }
      header { margin-bottom: 26px; }
      .tools { grid-template-columns: 1fr; }
      .tool-card { min-height: 195px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="eyebrow">TOOLS · 工具集合</div>
      <h1>页面索引</h1>
      <p class="intro">选择一个页面开始使用</p>
    </header>
    <nav class="tools" aria-label="工具页面">
      <a class="tool-card score" href="socres.html">
        <span class="icon" aria-hidden="true">🏓</span>
        <h2>乒乓球计分板</h2>
        <p class="description">记录比赛比分与局分，支持选择赛制、首发球方和撤销得分。</p>
        <span class="open">打开计分板 →</span>
      </a>
      <a class="tool-card draw" href="draw.html">
        <span class="icon" aria-hidden="true">🎉</span>
        <h2>星光抽奖</h2>
        <p class="description">使用网络头像抽取幸运参与者，带有闪动、中奖放大和礼花效果。</p>
        <span class="open">打开抽奖页面 →</span>
      </a>
    </nav>
    <footer>工具索引</footer>
  </main>
</body>
</html>
