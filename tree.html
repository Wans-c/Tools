<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#fffefa" />
  <meta name="description" content="一棵充满可能性的树。" />
  <title>树的故事 · 无限可能</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #fffefa;
      --ink: #48443c;
      --muted: #9b968b;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body {
      overflow: hidden;
      color: var(--ink);
      background: var(--paper);
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .scene { position: relative; width: 100%; height: 100%; min-height: 420px; overflow: hidden; }
    canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }
    .caption {
      position: absolute;
      z-index: 1;
      top: 76%;
      left: 50%;
      width: min(90%, 680px);
      margin: 0;
      transform: translateX(-50%);
      color: #48443c;
      text-align: center;
      font-family: "Comic Sans MS", "Bradley Hand", "Segoe Print", cursive;
      font-size: clamp(17px, 2.2vw, 23px);
      font-weight: 500;
      letter-spacing: .045em;
      line-height: 1.5;
      text-shadow: 0 1px 0 rgba(255,255,255,.7);
    }
    .caption span { display: block; margin-top: 5px; font: 13px/1.5 "PingFang SC", "Microsoft YaHei", sans-serif; color: #aaa59a; letter-spacing: .2em; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    @media (max-height: 560px) {
      .caption { top: 78%; font-size: clamp(15px, 2.7vh, 20px); }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; } }
  </style>
</head>
<body>
  <main class="scene" aria-label="手绘风格的绿树与一颗粉色爱心">
    <canvas id="painting" aria-hidden="true"></canvas>
    <h1 class="sr-only">树的故事</h1>
    <p class="caption">Life is a tree full of possibilities.<span>生命如树，充满无限可能</span></p>
  </main>
  <script>
    (() => {
      'use strict';
      const canvas = document.getElementById('painting');
      const ctx = canvas.getContext('2d');
      const scene = document.querySelector('.scene');
      const TAU = Math.PI * 2;
      let width = 0;
      let height = 0;
      let dpr = 1;
      let time = 0;
      let leaves = [];
      let seed = 74123;
      const random = () => {
        seed = (seed * 1664525 + 1013904223) >>> 0;
        return seed / 4294967296;
      };

      function resize() {
        const rect = scene.getBoundingClientRect();
        width = rect.width;
        height = rect.height;
        dpr = Math.min(window.devicePixelRatio || 1, 1.5);
        canvas.width = Math.max(1, Math.round(width * dpr));
        canvas.height = Math.max(1, Math.round(height * dpr));
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        makeLeaves();
      }

      function makeLeaves() {
        seed = 74123;
        const amount = Math.max(12, Math.min(24, Math.round(width / 48)));
        leaves = Array.from({ length: amount }, () => ({
          x: width * (.27 + random() * .46),
          y: height * (.08 + random() * .49),
          phase: random() * TAU,
          size: 2 + random() * 3,
          speed: .3 + random() * .55
        }));
      }

      function dab(x, y, rx, ry, color, angle = 0, alpha = 1) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(angle);
        ctx.globalAlpha = alpha;
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.ellipse(0, 0, Math.max(.5, rx), Math.max(.5, ry), 0, 0, TAU);
        ctx.fill();
        ctx.restore();
      }

      function stroke(points, color, lineWidth, alpha = 1) {
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.strokeStyle = color;
        ctx.lineWidth = lineWidth;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.beginPath();
        ctx.moveTo(points[0][0], points[0][1]);
        for (let i = 1; i < points.length; i++) ctx.lineTo(points[i][0], points[i][1]);
        ctx.stroke();
        ctx.restore();
      }

      function drawGround(cx, base, scale) {
        const green = ['#83c83e', '#9bd744', '#72b938', '#b0dc56'];
        for (let i = 0; i < 38; i++) {
          const x = cx + (random() - .5) * 2.25 * scale;
          const y = base + (random() - .5) * 15 * scale;
          dab(x, y, (9 + random() * 20) * scale, (1.3 + random() * 2.5) * scale,
            green[i % green.length], (random() - .5) * .12, .7 + random() * .25);
        }
        stroke([[cx - 1.05 * scale, base + 5 * scale], [cx - .48 * scale, base + 8 * scale], [cx + .12 * scale, base + 7 * scale], [cx + .9 * scale, base + 4 * scale]], '#78b638', 2.5 * scale, .8);
      }

      function drawTree(cx, base, scale) {
        const trunkTop = base - 205 * scale;
        const canopyTop = base - 420 * scale;
        const canopyBottom = base - 105 * scale;

        // A loose, hand-painted canopy made from layered brush dabs.
        const greens = ['#63b53f', '#72c642', '#84d23e', '#9cda27', '#a8df31', '#55aa3b', '#c2e649'];
        const canopyWidth = 210 * scale;
        const canopyHeight = 165 * scale;
        for (let layer = 0; layer < 5; layer++) {
          const count = 64 - layer * 5;
          for (let i = 0; i < count; i++) {
            const angle = random() * TAU;
            const radius = Math.sqrt(random());
            const x = cx + Math.cos(angle) * radius * canopyWidth;
            const y = canopyTop + canopyHeight * .52 + Math.sin(angle) * radius * canopyHeight;
            const size = (9 + random() * 17) * scale;
            const color = greens[Math.floor(random() * greens.length)];
            dab(x, y, size * (.72 + random() * .45), size * (.48 + random() * .4), color,
              (random() - .5) * .8, .76 + random() * .22);
          }
        }

        // Branches peek through the foliage.
        const bark = ['#725235', '#896442', '#9b744b', '#5f4935'];
        const branches = [
          [[cx, base - 10 * scale], [cx - 11 * scale, base - 88 * scale], [cx - 43 * scale, base - 151 * scale], [cx - 96 * scale, base - 191 * scale]],
          [[cx - 18 * scale, base - 115 * scale], [cx - 74 * scale, base - 143 * scale], [cx - 127 * scale, base - 148 * scale]],
          [[cx - 25 * scale, base - 143 * scale], [cx - 37 * scale, base - 218 * scale], [cx - 70 * scale, base - 259 * scale]],
          [[cx - 2 * scale, base - 138 * scale], [cx + 45 * scale, base - 180 * scale], [cx + 100 * scale, base - 196 * scale]],
          [[cx + 35 * scale, base - 174 * scale], [cx + 57 * scale, base - 229 * scale], [cx + 99 * scale, base - 258 * scale]],
          [[cx + 3 * scale, base - 108 * scale], [cx + 76 * scale, base - 140 * scale], [cx + 127 * scale, base - 148 * scale]],
          [[cx + 8 * scale, base - 178 * scale], [cx + 1 * scale, base - 250 * scale], [cx + 25 * scale, base - 293 * scale]]
        ];
        branches.forEach((branch, i) => stroke(branch.map(([x, y]) => [x, y]), bark[i % bark.length], (5 - (i % 3)) * scale, .72));

        // A softly irregular trunk, layered with short painterly marks.
        ctx.save();
        ctx.beginPath();
        ctx.moveTo(cx - 16 * scale, base + 1 * scale);
        ctx.quadraticCurveTo(cx - 5 * scale, base - 65 * scale, cx - 21 * scale, trunkTop + 40 * scale);
        ctx.quadraticCurveTo(cx - 8 * scale, trunkTop + 7 * scale, cx + 7 * scale, trunkTop);
        ctx.quadraticCurveTo(cx + 18 * scale, trunkTop + 49 * scale, cx + 20 * scale, base - 60 * scale);
        ctx.quadraticCurveTo(cx + 31 * scale, base - 22 * scale, cx + 51 * scale, base - 4 * scale);
        ctx.quadraticCurveTo(cx + 25 * scale, base + 5 * scale, cx, base + 1 * scale);
        ctx.closePath();
        const trunk = ctx.createLinearGradient(cx - 22 * scale, 0, cx + 37 * scale, 0);
        trunk.addColorStop(0, '#9c7a4d');
        trunk.addColorStop(.38, '#715538');
        trunk.addColorStop(.72, '#856443');
        trunk.addColorStop(1, '#5e4934');
        ctx.fillStyle = trunk;
        ctx.fill();
        ctx.restore();

        for (let i = 0; i < 45; i++) {
          const x = cx + (random() - .1) * 38 * scale;
          const y = trunkTop + random() * (base - trunkTop);
          dab(x, y, (1 + random() * 3) * scale, (3 + random() * 10) * scale,
            i % 2 ? '#c1a06a' : '#514432', (random() - .5) * .25, .24 + random() * .3);
        }

        // Root strokes anchor the tree to the little patch of grass.
        stroke([[cx - 28 * scale, base - 5 * scale], [cx - 11 * scale, base + 1 * scale], [cx + 5 * scale, base - 3 * scale], [cx + 27 * scale, base + 2 * scale]], '#725537', 5 * scale, .9);

        // Bright highlights on the leaf clusters give a watercolor/impasto feel.
        for (let i = 0; i < 53; i++) {
          const angle = random() * TAU;
          const r = Math.sqrt(random());
          const x = cx + Math.cos(angle) * r * canopyWidth * .92;
          const y = canopyTop + canopyHeight * .52 + Math.sin(angle) * r * canopyHeight * .9;
          dab(x, y, (4 + random() * 8) * scale, (3 + random() * 7) * scale,
            i % 3 ? '#c5e94a' : '#d5ed56', (random() - .5) * .7, .7);
        }
      }

      function drawHeart(x, y, size, alpha) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(-.16 + Math.sin(time * .001) * .035);
        ctx.globalAlpha = alpha;
        ctx.fillStyle = '#f6c6c5';
        ctx.beginPath();
        ctx.moveTo(0, size * .42);
        ctx.bezierCurveTo(-size * .14, size * .29, -size * .62, size * .05, -size * .43, -size * .25);
        ctx.bezierCurveTo(-size * .29, -size * .48, -size * .04, -size * .34, 0, -size * .16);
        ctx.bezierCurveTo(size * .13, -size * .46, size * .45, -size * .4, size * .5, -size * .12);
        ctx.bezierCurveTo(size * .56, size * .12, size * .19, size * .35, 0, size * .42);
        ctx.fill();
        dab(-size * .26, -size * .08, size * .1, size * .035, '#f3aaaa', -.55, .55);
        dab(size * .26, size * .09, size * .13, size * .04, '#f3aaaa', .5, .45);
        ctx.fillStyle = '#53473e';
        ctx.beginPath();
        ctx.arc(-size * .23, -size * .01, Math.max(1, size * .018), 0, TAU);
        ctx.fill();
        ctx.restore();
      }

      function drawFloatingLeaves() {
        const palette = ['#a8dc34', '#8dce36', '#d2e94e'];
        leaves.forEach((leaf) => {
          const x = leaf.x + Math.sin(time * .00035 + leaf.phase) * 7;
          const y = leaf.y + Math.sin(time * .0005 * leaf.speed + leaf.phase) * 5;
          dab(x, y, leaf.size * 1.3, leaf.size * .7, palette[Math.floor(leaf.phase * 3) % palette.length], leaf.phase, .78);
        });
      }

      function render(ts) {
        time = ts;
        ctx.clearRect(0, 0, width, height);
        ctx.fillStyle = '#fffefa';
        ctx.fillRect(0, 0, width, height);

        const scale = Math.min(width / 720, height / 720, 1.2);
        const cx = width * .5;
        const base = height * .69;
        drawGround(cx, base, scale);
        drawTree(cx, base, scale);
        drawFloatingLeaves();
        drawHeart(width * .76, height * .14, 53 * scale, .92);
        requestAnimationFrame(render);
      }

      window.addEventListener('resize', resize);
      resize();
      requestAnimationFrame(render);
    })();
  </script>
</body>
</html>
