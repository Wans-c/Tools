<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#100d2e">
  <title>星光抽奖</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #100d2e;
      --panel: rgba(31, 26, 73, .82);
      --pink: #ff65bd;
      --cyan: #66eaff;
      --gold: #ffd76a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: #fff;
      font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      background:
        radial-gradient(ellipse at 50% 20%, rgba(101, 63, 180, .35), transparent 55%),
        radial-gradient(circle at 10% 85%, rgba(25, 182, 221, .15), transparent 30%),
        var(--bg);
      overflow-x: hidden;
    }
    body::before {
      content: ""; position: fixed; inset: 0; pointer-events: none; opacity: .4;
      background-image: radial-gradient(2px 2px at 20px 30px, white 50%, transparent),
        radial-gradient(1px 1px at 70px 90px, white 50%, transparent),
        radial-gradient(1.5px 1.5px at 130px 40px, white 50%, transparent);
      background-size: 180px 130px;
      animation: twinkle 4s ease-in-out infinite alternate;
    }
    @keyframes twinkle { to { opacity: .8; } }
    .page { width: min(1120px, 92vw); margin: 0 auto; padding: 38px 0 56px; position: relative; }
    header { text-align: center; margin-bottom: 28px; }
    .eyebrow { color: var(--cyan); letter-spacing: .35em; font-size: 12px; font-weight: 700; }
    h1 { margin: 9px 0 8px; font-size: clamp(32px, 6vw, 58px); letter-spacing: .12em; text-shadow: 0 0 24px rgba(255, 101, 189, .55); }
    .subtitle { color: #c7c1e6; margin: 0; }
    .layout { display: grid; grid-template-columns: minmax(0, 1fr) 310px; gap: 20px; align-items: start; }
    .stage, .side-card { border: 1px solid rgba(176, 159, 255, .2); background: var(--panel); backdrop-filter: blur(14px); border-radius: 22px; box-shadow: 0 18px 60px rgba(0,0,0,.2); }
    .stage { min-height: 510px; padding: 28px; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; overflow: hidden; }
    .stage::before { content: ""; position: absolute; width: 430px; height: 430px; border-radius: 50%; background: radial-gradient(circle, rgba(91, 62, 177, .26), transparent 70%); pointer-events: none; }
    .stage-label { z-index: 1; color: #d3c8ff; font-size: 14px; letter-spacing: .12em; margin-bottom: 18px; }
    .avatar-wrap { width: 224px; height: 224px; border-radius: 50%; padding: 8px; position: relative; z-index: 1; background: linear-gradient(135deg, var(--cyan), #8d68ff, var(--pink)); box-shadow: 0 0 36px rgba(110, 108, 255, .55); transition: transform .45s cubic-bezier(.2,.8,.2,1), box-shadow .45s; }
    .avatar-wrap::after { content: ""; position: absolute; inset: -10px; border: 1px solid rgba(255,255,255,.25); border-radius: 50%; animation: orbit 12s linear infinite; }
    @keyframes orbit { to { transform: rotate(360deg); } }
    .avatar { display: block; width: 100%; height: 100%; border-radius: 50%; object-fit: cover; background: #30285c; border: 4px solid #171333; }
    .winner-name { z-index: 1; min-height: 44px; margin: 18px 0 5px; font-size: clamp(23px, 4vw, 34px); font-weight: 800; text-align: center; }
    .winner-hint { z-index: 1; min-height: 22px; color: #b6afd7; font-size: 14px; text-align: center; }
    .drawing .avatar-wrap { animation: flicker .16s linear infinite alternate; }
    @keyframes flicker { from { transform: scale(.96); filter: brightness(.75); } to { transform: scale(1.04); filter: brightness(1.35); } }
    .is-winner .avatar-wrap { transform: scale(1.16); box-shadow: 0 0 28px #fff, 0 0 70px var(--pink), 0 0 110px rgba(255,215,106,.7); }
    .is-winner .winner-name { color: var(--gold); text-shadow: 0 0 20px rgba(255,215,106,.65); animation: name-pop .55s cubic-bezier(.2,1.8,.4,1) both; }
    @keyframes name-pop { from { transform: scale(.6); opacity: .2; } to { transform: scale(1); opacity: 1; } }
    .controls { z-index: 1; display: flex; gap: 12px; margin-top: 24px; flex-wrap: wrap; justify-content: center; }
    button { font: inherit; cursor: pointer; border: 0; color: #fff; transition: transform .18s, filter .18s, opacity .18s; }
    button:hover:not(:disabled) { transform: translateY(-2px); filter: brightness(1.12); }
    button:disabled { opacity: .45; cursor: not-allowed; }
    .primary { min-width: 154px; padding: 13px 28px; border-radius: 999px; font-weight: 800; letter-spacing: .08em; color: #26123c; background: linear-gradient(100deg, #ffe27e, #ff8ed2); box-shadow: 0 8px 26px rgba(255, 101, 189, .3); }
    .secondary { padding: 12px 20px; border-radius: 999px; color: #e5dcff; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.15); }
    .side-card { padding: 20px; }
    .side-card h2 { font-size: 17px; margin: 0 0 7px; }
    .help { margin: 0 0 12px; color: #aaa3c9; font-size: 12px; line-height: 1.7; }
    textarea { width: 100%; height: 178px; resize: vertical; border-radius: 12px; border: 1px solid rgba(184,169,255,.25); background: rgba(9,7,30,.55); color: #f5f2ff; padding: 12px; font: 13px/1.8 ui-monospace, SFMono-Regular, Consolas, monospace; outline: none; }
    textarea:focus { border-color: var(--cyan); }
    .list-actions { display: flex; gap: 8px; margin-top: 10px; }
    .list-actions button { flex: 1; padding: 9px 8px; border-radius: 9px; font-size: 12px; background: rgba(116, 95, 190, .35); }
    .stats { display: flex; justify-content: space-between; color: #bdb5db; font-size: 13px; padding: 14px 2px 11px; border-bottom: 1px solid rgba(255,255,255,.1); }
    .stats strong { color: var(--cyan); }
    .history-title { margin: 15px 0 8px; font-size: 14px; }
    .history { display: flex; flex-direction: column; gap: 7px; max-height: 175px; overflow: auto; }
    .history-item { display: flex; align-items: center; gap: 9px; color: #ded9f3; font-size: 13px; padding: 6px 8px; background: rgba(255,255,255,.05); border-radius: 10px; }
    .history-item img { width: 29px; height: 29px; object-fit: cover; border-radius: 50%; }
    .empty { color: #847da5; font-size: 12px; padding: 6px 0; }
    #confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
    .note { color: #817a9e; font-size: 11px; line-height: 1.6; margin: 13px 2px 0; }
    @media (max-width: 760px) {
      .page { padding-top: 26px; }
      .layout { grid-template-columns: 1fr; }
      .stage { min-height: 450px; padding: 22px 14px; }
      .avatar-wrap { width: 190px; height: 190px; }
      .side-card { order: 2; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; } }
  </style>
</head>
<body>
  <canvas id="confetti" aria-hidden="true"></canvas>
  <main class="page">
    <header>
      <div class="eyebrow">LUCKY DRAW · 好运降临</div>
      <h1>星光抽奖</h1>
      <p class="subtitle">让惊喜，在星光中揭晓</p>
    </header>
    <div class="layout">
      <section class="stage" id="stage" aria-live="polite">
        <div class="stage-label" id="stageLabel">准备好迎接幸运了吗？</div>
        <div class="avatar-wrap"><img class="avatar" id="avatar" alt="抽奖头像" src="https://randomuser.me/api/portraits/women/44.jpg"></div>
        <div class="winner-name" id="winnerName">幸运大奖等你来</div>
        <div class="winner-hint" id="winnerHint">共 12 位参与者</div>
        <div class="controls">
          <button class="primary" id="drawButton" type="button">开始抽奖</button>
          <button class="secondary" id="resetButton" type="button">重置抽奖</button>
        </div>
      </section>
      <aside class="side-card">
        <h2>参与名单</h2>
        <p class="help">每行一位参与者，可写成「姓名,头像网址」。不填网址会自动使用网络头像。</p>
        <textarea id="participants" aria-label="参与者名单" spellcheck="false"></textarea>
        <div class="list-actions">
          <button type="button" id="applyButton">更新名单</button>
          <button type="button" id="sampleButton">载入示例</button>
        </div>
        <div class="stats"><span>可抽人数 <strong id="remainingCount">12</strong></span><span>已中奖 <strong id="winnerCount">0</strong></span></div>
        <h3 class="history-title">中奖名单</h3>
        <div class="history" id="history"><div class="empty">中奖结果会显示在这里</div></div>
        <p class="note">头像需要联网加载。抽中的参与者会从本轮名单移除，点击「重置抽奖」可重新抽取。</p>
      </aside>
    </div>
  </main>
<script>
  const samplePeople = [
    ['林小满', 'women/44'], ['陈星宇', 'men/32'], ['周可欣', 'women/68'],
    ['王子涵', 'men/75'], ['苏念', 'women/12'], ['赵一鸣', 'men/46'],
    ['许安然', 'women/23'], ['顾明远', 'men/18'], ['沈知夏', 'women/55'],
    ['陆景行', 'men/61'], ['唐果果', 'women/39'], ['程予安', 'men/84']
  ];
  const fallbackAvatar = 'https://randomuser.me/api/portraits/lego/1.jpg';
  const participantsInput = document.getElementById('participants');
  const stage = document.getElementById('stage');
  const avatar = document.getElementById('avatar');
  const winnerName = document.getElementById('winnerName');
  const winnerHint = document.getElementById('winnerHint');
  const stageLabel = document.getElementById('stageLabel');
  const drawButton = document.getElementById('drawButton');
  const remainingCount = document.getElementById('remainingCount');
  const winnerCount = document.getElementById('winnerCount');
  const history = document.getElementById('history');
  let people = [];
  let winners = [];
  let drawing = false;
  let drawTimer = null;

  function loadSampleText() {
    participantsInput.value = samplePeople.map(([name, path]) => `${name},https://randomuser.me/api/portraits/${path}.jpg`).join('\n');
  }
  function makePeople(text) {
    const seen = new Set();
    return text.split(/\r?\n/).map((line, index) => {
      const parts = line.split(',');
      const name = (parts.shift() || '').trim();
      const image = parts.join(',').trim();
      if (!name || seen.has(name)) return null;
      seen.add(name);
      return { name, image: image || `https://i.pravatar.cc/160?img=${(index % 70) + 1}` };
    }).filter(Boolean);
  }
  function updateCounts() {
    remainingCount.textContent = people.length;
    winnerCount.textContent = winners.length;
    winnerHint.textContent = people.length ? `还有 ${people.length} 位参与者` : '本轮抽奖已结束';
    drawButton.disabled = drawing || people.length === 0;
  }
  function renderHistory() {
    if (!winners.length) {
      history.innerHTML = '<div class="empty">中奖结果会显示在这里</div>';
      return;
    }
    history.innerHTML = '';
    [...winners].reverse().forEach(person => {
      const row = document.createElement('div');
      row.className = 'history-item';
      const image = document.createElement('img');
      image.src = person.image;
      image.alt = '';
      image.onerror = () => { image.src = fallbackAvatar; };
      const label = document.createElement('span');
      label.textContent = person.name;
      row.append(image, label);
      history.appendChild(row);
    });
  }
  function applyList() {
    if (drawing) return;
    const parsed = makePeople(participantsInput.value);
    if (!parsed.length) {
      alert('请至少输入一位参与者。');
      return;
    }
    people = parsed;
    winners = [];
    stage.classList.remove('is-winner');
    avatar.src = people[0].image;
    winnerName.textContent = '幸运大奖等你来';
    stageLabel.textContent = '准备好迎接幸运了吗？';
    updateCounts();
    renderHistory();
  }
  function startDraw() {
    if (drawing || !people.length) return;
    drawing = true;
    stage.classList.remove('is-winner');
    stage.classList.add('drawing');
    stageLabel.textContent = '幸运正在降临…';
    drawButton.textContent = '抽奖中…';
    drawButton.disabled = true;
    let ticks = 0;
    drawTimer = setInterval(() => {
      const preview = people[Math.floor(Math.random() * people.length)];
      avatar.src = preview.image;
      winnerName.textContent = preview.name;
      ticks++;
      if (ticks >= 24) finishDraw();
    }, 100);
  }
  function finishDraw() {
    clearInterval(drawTimer);
    drawTimer = null;
    const index = Math.floor(Math.random() * people.length);
    const winner = people.splice(index, 1)[0];
    winners.push(winner);
    avatar.src = winner.image;
    winnerName.textContent = winner.name;
    stage.classList.remove('drawing');
    stage.classList.add('is-winner');
    stageLabel.textContent = '恭喜这位幸运儿！';
    drawButton.textContent = '再抽一位';
    drawing = false;
    updateCounts();
    renderHistory();
    celebrate();
  }
  function resetDraw() {
    if (drawing) {
      clearInterval(drawTimer);
      drawTimer = null;
      drawing = false;
      stage.classList.remove('drawing');
    }
    people = makePeople(participantsInput.value);
    winners = [];
    stage.classList.remove('is-winner');
    stageLabel.textContent = '准备好迎接幸运了吗？';
    winnerName.textContent = '幸运大奖等你来';
    avatar.src = people[0]?.image || fallbackAvatar;
    drawButton.textContent = '开始抽奖';
    updateCounts();
    renderHistory();
  }
  document.getElementById('applyButton').addEventListener('click', applyList);
  document.getElementById('sampleButton').addEventListener('click', () => { loadSampleText(); applyList(); });
  drawButton.addEventListener('click', startDraw);
  document.getElementById('resetButton').addEventListener('click', resetDraw);
  avatar.onerror = () => { avatar.onerror = null; avatar.src = fallbackAvatar; };

  // Lightweight canvas confetti: no external animation library required.
  const canvas = document.getElementById('confetti');
  const ctx = canvas.getContext('2d');
  let particles = [];
  let animationFrame = 0;
  function resizeCanvas() {
    const ratio = window.devicePixelRatio || 1;
    canvas.width = window.innerWidth * ratio;
    canvas.height = window.innerHeight * ratio;
    ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();
  function celebrate() {
    const colors = ['#ff65bd', '#66eaff', '#ffd76a', '#a78bfa', '#ffffff', '#75f0a8'];
    for (let burst = 0; burst < 3; burst++) {
      const originX = window.innerWidth * (0.2 + Math.random() * 0.6);
      const originY = window.innerHeight * (0.18 + Math.random() * 0.35);
      for (let i = 0; i < 75; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 2 + Math.random() * 6;
        particles.push({ x: originX, y: originY, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed - 2,
          size: 3 + Math.random() * 5, color: colors[Math.floor(Math.random() * colors.length)],
          rotation: Math.random() * 6, spin: (Math.random() - .5) * .25, life: 75 + Math.random() * 35 });
      }
    }
    if (!animationFrame) animateConfetti();
  }
  function animateConfetti() {
    ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
    particles = particles.filter(p => p.life > 0 && p.y < window.innerHeight + 20);
    for (const p of particles) {
      p.x += p.vx; p.y += p.vy; p.vy += .09; p.vx *= .99; p.rotation += p.spin; p.life--;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rotation);
      ctx.globalAlpha = Math.min(1, p.life / 18);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * .68);
      ctx.restore();
    }
    if (particles.length) animationFrame = requestAnimationFrame(animateConfetti);
    else { cancelAnimationFrame(animationFrame); animationFrame = 0; ctx.clearRect(0, 0, window.innerWidth, window.innerHeight); }
  }

  loadSampleText();
  people = makePeople(participantsInput.value);
  avatar.src = people[0].image;
  updateCounts();
</script>
</body>
</html>
